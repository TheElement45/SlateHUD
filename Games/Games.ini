[Rainmeter]
Group=SlateHUD
@IncludeContext=#@#Context.inc
Update=1000
DefaultUpdateDivider=-1
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!Draggable 0][!AutoSelectScreen 1][!CommandMeasure MeasureGameHub "Setup()"]
MouseLeaveAction=[!CommandMeasure MeasureGameHub "ResetHover()"]
RightMouseUpAction=[!CommandMeasure MeasureGameHub "SuiteMenu()"]
MouseScrollUpAction=[!CommandMeasure MeasureGameHub "ChangePage(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureGameHub "ChangePage(1)"]
ToolTipHidden=1

[Metadata]
Name=Game Hub
Author=Element
Information=Icon launcher with favorites, search and one expandable category at a time.
License=MIT
Version=2.4.0

[Variables]
@Include=#@#Variables.inc
GameCardW=#WideCardW#
GameCardH=348
pathGamesFolder=#GamesFolder#
pathDiscord=discord://
GameSearchInput=
GameLaunchId=
GameLaunchRevision=legacy
GameLaunchMode=

[MeasureGameHub]
Measure=Script
ScriptFile=#@#GameHub.lua
; Keep layout/docking and failed-command recovery checks alive.
UpdateDivider=1

[MeasureScan]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#ScanGames.ps1"
State=Hide
Timeout=90000
UpdateDivider=-1
OutputType=UTF8
FinishAction=[!CommandMeasure MeasureGameHub "FinishScan()"]

[MeasureLaunch]
Measure=Plugin
Plugin=RunCommand
Program="#@#SlateHUDHelper.exe"
Parameter=launchgame "#GameLaunchId#" "#GameLaunchRevision#" #GameLaunchMode#
State=Hide
Timeout=15000
OutputType=UTF8
UpdateDivider=-1
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureGameHub "FinishLaunch()"]

[MeasureAnimPower]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE
UpdateDivider=-1

[MeasureHoverAnim]
Measure=Plugin
Plugin=ActionTimer
IgnoreWarnings=1
ActionList1=Repeat Step, 24, 4
Step=[!CommandMeasure MeasureGameHub "AnimStep()"]
UpdateDivider=-1

; Retained only as a fallback when an older meter-based GameList.inc is still on disk.
[StyleCategory]
Hidden=1
ClipString=1
DynamicVariables=1
[StyleItem]
Hidden=1
ClipString=1
DynamicVariables=1

[StyleGameText]
FontFace=#fontName#
FontSize=(8*#UiScale#)
FontColor=#ColorSecondary#
StringEffect=Shadow
FontEffectColor=0,0,0,80
AntiAlias=1
ClipString=1
DynamicVariables=1

[StyleGameControl]
MeterStyle=StyleGameText
FontFace=#fontName#
FontSize=(8*#UiScale#)
FontColor=#ColorSecondary#
AntiAlias=1
ClipString=1
DynamicVariables=1
SolidColor=#ColorPill#
MouseActionCursor=1
W=(140*#UiScale#)
H=(24*#UiScale#)
MouseLeaveAction=[!CommandMeasure MeasureGameHub "ClearHint()"]

[MeterBackground]
Meter=Shape
X=(#CardPadX#*#UiScale#)
Y=(#CardPadY#*#UiScale#)
Shape=Rectangle 0,0,(#GameCardW#*#UiScale#),(#GameCardH#*#UiScale#),(#CardRadius#*#UiScale#) | Fill Color #CardFill# | StrokeWidth 1 | Stroke Color #CardStroke#
DynamicVariables=1

[MeterTitle]
Meter=String
MeterStyle=StyleGameText
FontSize=(10.5*#UiScale#)
FontWeight=700
FontColor=#ColorPrimary#
X=((24+#CardShiftX#)*#UiScale#)
Y=((29+#CardShiftY#)*#UiScale#)
Text=GAME HUB
MouseActionCursor=1
LeftMouseUpAction=["#pathGamesFolder#"]
MouseOverAction=[!CommandMeasure MeasureGameHub "SetHint('Open your games folder')"]
MouseLeaveAction=[!CommandMeasure MeasureGameHub "ClearHint()"]

[MeterBtnScan]
Meter=String
MeterStyle=StyleGameControl
FontSize=(7*#UiScale#)
StringAlign=Right
X=((312+#CardShiftX#)*#UiScale#)
Y=((31+#CardShiftY#)*#UiScale#)
W=(74*#UiScale#)
H=(20*#UiScale#)
SolidColor=0,0,0,1
Text=SCAN
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "BeginScan()"]
MouseOverAction=[!CommandMeasure MeasureGameHub "ScanHint()"]

[MeterDivider]
Meter=Shape
X=((24+#CardShiftX#)*#UiScale#)
Y=((55+#CardShiftY#)*#UiScale#)
Shape=Line 0,0,(288*#UiScale#),0 | Stroke Color #ColorDivider# | StrokeWidth 1

[MeterSearch]
Meter=String
MeterStyle=StyleGameControl
X=((24+#CardShiftX#)*#UiScale#)
Y=((58+#CardShiftY#)*#UiScale#)
W=(288*#UiScale#)
H=(14*#UiScale#)
Padding=0,(4*#UiScale#),0,(4*#UiScale#)
Text=  Search games...
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "EditSearch()"]
RightMouseUpAction=[!CommandMeasure MeasureGameHub "ClearSearch()"]
MouseOverAction=[!CommandMeasure MeasureGameHub "SetHint('Type a game name and press Enter. Right-click to clear.')"]

[MeterClearSearch]
Meter=String
MeterStyle=StyleGameControl
X=((288+#CardShiftX#)*#UiScale#)
Y=((58+#CardShiftY#)*#UiScale#)
W=(24*#UiScale#)
H=(14*#UiScale#)
Padding=0,(4*#UiScale#),0,(4*#UiScale#)
Text= x
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "ClearSearch()"]
RightMouseUpAction=[!CommandMeasure MeasureGameHub "ClearSearch()"]
MouseOverAction=[!CommandMeasure MeasureGameHub "SetHint('Clear search and return to your category')"]

[MeasureSearch]
Measure=Plugin
Plugin=InputText
X=((24+#CardShiftX#)*#UiScale#)
Y=((58+#CardShiftY#)*#UiScale#)
W=(288*#UiScale#)
H=(24*#UiScale#)
FontFace=#fontName#
FontSize=(9*#UiScale#)
FontColor=#ColorPrimary#
SolidColor=#ColorInputFill#
FocusDismiss=1
InputLimit=120
Command1=[!SetVariable GameSearchInput """ $UserInput$ """][!UpdateMeasure MeasureSearchValue][!CommandMeasure MeasureGameHub "Filter()"]

[MeasureSearchValue]
Measure=String
String=#GameSearchInput#
DynamicVariables=1
UpdateDivider=-1
RegExpSubstitute=1
Substitute='^\s+|\s+$':"",'"':"'"

[MeterFavoritesTitle]
Meter=String
MeterStyle=StyleGameText
FontSize=(7.5*#UiScale#)
FontColor=#ColorMuted#
X=((24+#CardShiftX#)*#UiScale#)
Y=((88+#CardShiftY#)*#UiScale#)
W=(288*#UiScale#)
H=(16*#UiScale#)
Text=FAVORITES

[MeterEmptyFavorites]
Meter=String
MeterStyle=StyleGameText
FontSize=(7.5*#UiScale#)
FontColor=#ColorMuted#
X=((24+#CardShiftX#)*#UiScale#)
Y=((110+#CardShiftY#)*#UiScale#)
W=(288*#UiScale#)
H=(28*#UiScale#)
Text=Right-click a game below to pin it here.

[MeterEmpty]
Meter=String
MeterStyle=StyleGameText
X=((24+#CardShiftX#)*#UiScale#)
Y=((88+#CardShiftY#)*#UiScale#)
W=(288*#UiScale#)
H=(32*#UiScale#)
Hidden=1

[MeterSubtitle]
Meter=String
MeterStyle=StyleGameText
FontSize=(7*#UiScale#)
FontColor=#ColorMuted#
X=((24+#CardShiftX#)*#UiScale#)
Y=((300+#CardShiftY#)*#UiScale#)
W=(288*#UiScale#)
H=(16*#UiScale#)
Text=Game library
MouseOverAction=[!CommandMeasure MeasureGameHub "ScanHint()"]
MouseLeaveAction=[!CommandMeasure MeasureGameHub "ClearHint()"]

[MeterHint]
Meter=String
MeterStyle=StyleGameText
FontSize=(7.5*#UiScale#)
FontColor=#ColorMuted#
ClipString=2
X=((24+#CardShiftX#)*#UiScale#)
Y=((324+#CardShiftY#)*#UiScale#)
W=(288*#UiScale#)
H=(28*#UiScale#)
Text=Right-click a game to pin / unpin

[StyleGamePager]
MeterStyle=StyleGameControl
FontFace=#fontName#
FontSize=(8*#UiScale#)
FontColor=#ColorSecondary#
AntiAlias=1
DynamicVariables=1
SolidColor=0,0,0,1
MouseActionCursor=1
W=(24*#UiScale#)
H=(18*#UiScale#)
Hidden=1
MouseLeaveAction=[!CommandMeasure MeasureGameHub "ClearHint()"]

[MeterPagePrev]
Meter=String
MeterStyle=StyleGamePager
X=((208+#CardShiftX#)*#UiScale#)
Text=<
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "ChangePage(-1)"]
MouseOverAction=[!CommandMeasure MeasureGameHub "SetHint('Previous page | Scroll up')"]

[MeterPageNumber]
Meter=String
MeterStyle=StyleGamePager
StringAlign=Center
X=((260+#CardShiftX#)*#UiScale#)
W=(44*#UiScale#)
Text=1 / 1

[MeterPageNext]
Meter=String
MeterStyle=StyleGamePager
X=((296+#CardShiftX#)*#UiScale#)
Text=>
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "ChangePage(1)"]
MouseOverAction=[!CommandMeasure MeasureGameHub "SetHint('Next page | Scroll down')"]

; Generated library metadata is never edited by the view controller.
@IncludeGameList=#CURRENTPATH#GameList.inc

[MeterCategory1]
Meter=String
MeterStyle=StyleGameControl
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "ToggleCategory(1)"]
MouseOverAction=[!CommandMeasure MeasureGameHub "CategoryHint(1)"]

[MeterCategory2]
Meter=String
MeterStyle=StyleGameControl
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "ToggleCategory(2)"]
MouseOverAction=[!CommandMeasure MeasureGameHub "CategoryHint(2)"]

[MeterCategory3]
Meter=String
MeterStyle=StyleGameControl
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "ToggleCategory(3)"]
MouseOverAction=[!CommandMeasure MeasureGameHub "CategoryHint(3)"]

[MeterCategory4]
Meter=String
MeterStyle=StyleGameControl
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "ToggleCategory(4)"]
MouseOverAction=[!CommandMeasure MeasureGameHub "CategoryHint(4)"]

[MeterCategory5]
Meter=String
MeterStyle=StyleGameControl
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "ToggleCategory(5)"]
MouseOverAction=[!CommandMeasure MeasureGameHub "CategoryHint(5)"]

[MeterCategory6]
Meter=String
MeterStyle=StyleGameControl
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "ToggleCategory(6)"]
MouseOverAction=[!CommandMeasure MeasureGameHub "CategoryHint(6)"]

[MeterCategory7]
Meter=String
MeterStyle=StyleGameControl
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "ToggleCategory(7)"]
MouseOverAction=[!CommandMeasure MeasureGameHub "CategoryHint(7)"]

[MeterCategory8]
Meter=String
MeterStyle=StyleGameControl
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureGameHub "ToggleCategory(8)"]
MouseOverAction=[!CommandMeasure MeasureGameHub "CategoryHint(8)"]

@IncludeTiles=#CURRENTPATH#Tiles.inc

[MeterPad]
Meter=Image
X=((#GameCardW#+#ActiveFrameW#-1)*#UiScale#)
Y=((#GameCardH#+#ActiveFrameH#-1)*#UiScale#)
W=1
H=1
SolidColor=0,0,0,1
DynamicVariables=1
