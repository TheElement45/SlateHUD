[Rainmeter]
Group=SlateHUD
@IncludeContext=#@#Context.inc
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!Draggable 0][!CommandMeasure MeasureHelperWatchdog "Check()"]
MouseScrollUpAction=[!CommandMeasure MeasureVolumeRaw "ChangeVolume 2"][!UpdateMeasure MeasureVolumeRaw][!UpdateMeasure MeasureVolume][!UpdateMeasure MeasureVolIcon][!UpdateMeter MeterVolume][!UpdateMeter MeterVolIcon][!Redraw][!CommandMeasure MeasureMedia "FlashVolume()"]
MouseScrollDownAction=[!CommandMeasure MeasureVolumeRaw "ChangeVolume -2"][!UpdateMeasure MeasureVolumeRaw][!UpdateMeasure MeasureVolume][!UpdateMeasure MeasureVolIcon][!UpdateMeter MeterVolume][!UpdateMeter MeterVolIcon][!Redraw][!CommandMeasure MeasureMedia "FlashVolume()"]

[Metadata]
Name=Now Playing
Author=Element
Information=Uses Windows SMTC helper to support Pear Desktop (YouTube Music), Browsers, and Spotify.
Version=2.4.0
License=MIT

[Variables]
@Include=#@#Variables.inc
MediaTitle=Nothing playing
MediaArtist=Play music in any app
MediaStateIcon=[\xE768]
MediaPosition=00:00
MediaDuration=00:00
MediaProgress=0
MediaCover=
MediaSession=

; ============================================================================
; MEASURES (Windows SMTC Helper for Pear Desktop / YouTube Music / Spotify)
; ============================================================================

; Runs the shared singleton background helper (also monitored by System\System.ini).
; Exits immediately if another instance is already running, and exits when Rainmeter does.
[MeasureHelper]
Measure=Plugin
Plugin=RunCommand
Program="#@#SlateHUDHelper.exe"
Parameter=ensure
State=Hide
Timeout=2000

[MeasureHealthBridge]
Measure=Plugin
Plugin=SlateHUD
Stream=HelperHealth
FallbackPath=#@#Cache\helper-health.txt
UpdateDivider=5

[MeasureHelperWatchdog]
Measure=Script
ScriptFile=#@#HelperWatchdog.lua
UpdateDivider=5

[MeasureAnimPower]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE
UpdateDivider=-1

[MeasureUiAnim]
Measure=Plugin
Plugin=ActionTimer
IgnoreWarnings=1
ActionList1=PulseOn | Wait 180 | PulseOff
PulseOn=[!SetOption MeterProgressBar H "(6*#UiScale#)"][!SetOption MeterProgressBar Y "((71+#CardShiftY#)*#UiScale#)"][!SetOption MeterProgressBar BarColor "#ColorPrimary#"][!UpdateMeter MeterProgressBar][!Redraw]
PulseOff=[!SetOption MeterProgressBar H "(4*#UiScale#)"][!SetOption MeterProgressBar Y "((72+#CardShiftY#)*#UiScale#)"][!CommandMeasure MeasureMedia "RestoreProgress()"]
ActionList2=VolOn | Wait 450 | VolOff
VolOn=[!SetOption MeterVolume FontColor "#ColorAccent#"][!SetOption MeterVolIcon FontColor "#ColorAccent#"][!UpdateMeter MeterVolume][!UpdateMeter MeterVolIcon][!Redraw]
VolOff=[!SetOption MeterVolume FontColor "#ColorSecondary#"][!SetOption MeterVolIcon FontColor "#ColorSecondary#"][!UpdateMeter MeterVolume][!UpdateMeter MeterVolIcon][!Redraw]
UpdateDivider=-1

[MeasureMediaHealthBridge]
Measure=Plugin
Plugin=SlateHUD
Stream=MediaHealth
FallbackPath=#@#Cache\media-health.txt

[MeasureMediaBridge]
Measure=Plugin
Plugin=SlateHUD
Stream=Media
FallbackPath=#@#Cache\media.txt
HelperPath=#@#SlateHUDHelper.exe
FinishAction=[!UpdateMeasure MeasureMediaBridge][!UpdateMeasure MeasureMediaHealthBridge][!CommandMeasure MeasureMedia "FinishControl()"]

; Read the helper's atomic snapshot once, before dependent SMTC measures.
; No asynchronous file parser, duplicate script update, or second redraw.
[MeasureMedia]
Measure=Script
; UTF-16 entry point enables Unicode strings at the Rainmeter/Lua boundary.
ScriptFile=#@#MediaUnicode.lua

; One-shot media commands (play/pause, next, prev, seek).
[MeasureSMTCCmd]
FinishAction=[!CommandMeasure MeasureMedia "FinishControl()"]
OutputType=UTF8
Measure=Plugin
Plugin=RunCommand
Program="#@#SlateHUDHelper.exe"
State=Hide
Timeout=10000

[MeasurePlayer]
Measure=String
Group=SMTC
String=#MediaTitle#
DynamicVariables=1
IfMatch="^Nothing playing$"
IfMatchAction=[!SetOption MeterTrackTitle FontColor "#ColorSecondary#"][!SetOption MeterArtistName FontColor "#ColorSecondary#"][!SetOption MeterTrackTitle MouseActionCursor 1][!SetOption MeterArtistName MouseActionCursor 1][!SetOption MeterArtistName Text "Click to open #MusicAppName#"]
IfNotMatchAction=[!SetOption MeterTrackTitle FontColor "#ColorPrimary#"][!SetOption MeterArtistName FontColor "#ColorSecondary#"][!SetOption MeterTrackTitle MouseActionCursor 0][!SetOption MeterArtistName MouseActionCursor 0][!SetOption MeterArtistName Text "%1"]
IfMatchMode=0

; A click checks the current media state, so playing/paused tracks keep their controls.
[MeasureOpenMusic]
Measure=String
String=[MeasurePlayer]
DynamicVariables=1
Disabled=1
UpdateDivider=-1
IfMatch=^Nothing playing$
IfMatchMode=1
IfMatchAction=["#MusicApp#"]

[MeasureArtist]
Measure=String
Group=SMTC
String=#MediaArtist#
DynamicVariables=1

[MeasureState]
Measure=String
Group=SMTC
String=#MediaStateIcon#
DynamicVariables=1

[MeasurePosition]
Measure=String
Group=SMTC
String=#MediaPosition#
DynamicVariables=1

[MeasureDuration]
Measure=String
Group=SMTC
String=#MediaDuration#
DynamicVariables=1

[MeasureProgressStr]
Measure=String
Group=SMTC
String=#MediaProgress#
DynamicVariables=1

[MeasureProgress]
Measure=Calc
Group=SMTC
Formula=[MeasureProgressStr]
DynamicVariables=1
MinValue=0
MaxValue=100

[MeasureAlbumArt]
Measure=String
Group=SMTC
String=#MediaCover#
DynamicVariables=1

[MeasureVolumeRaw]
Measure=Plugin
Plugin=Win7AudioPlugin
RegExpSubstitute=1
Substitute="^ERROR.*$":"Unavailable","^$":"Unavailable"

[MeasureSession]
Measure=String
Group=SMTC
String=#MediaSession#
DynamicVariables=1

[MeasureVolume]
Measure=Calc
Formula=MeasureVolumeRaw
RegExpSubstitute=1
Substitute="^-1$":"Muted","^([0-9]+)$":"\1%"

[MeasureVolIcon]
Measure=Calc
Formula=MeasureVolumeRaw
RegExpSubstitute=1
Substitute="^-1$":"[\xE74F]","^0$":"[\xE74F]","^([0-9]+)$":"[\xE767]"

; ============================================================================
; STYLES
; ============================================================================

[StyleText]
FontFace=#fontName#
StringEffect=Shadow
FontEffectColor=0,0,0,80
AntiAlias=1
DynamicVariables=1

[StyleIconBtn]
FontFace=#iconFont#
FontSize=(11*#UiScale#)
FontColor=#ColorPrimary#
StringAlign=CenterCenter
AntiAlias=1
SolidColor=0,0,0,1
MouseActionCursor=1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "#ColorAccent#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!CommandMeasure MeasureMedia "RestoreControls()"][!UpdateMeter MeterPrevButton][!UpdateMeter MeterPlayPauseButton][!UpdateMeter MeterNextButton][!Redraw]
W=(24*#UiScale#)
H=(24*#UiScale#)

; ============================================================================
; METERS
; ============================================================================

[MeterBackground]
Meter=Shape
X=(#CardPadX#*#UiScale#)
Y=(#CardPadY#*#UiScale#)
Shape=Rectangle 0,0,(#WideCardW#*#UiScale#),(#MediaCardH#*#UiScale#),(#CardRadius#*#UiScale#)| Fill Color #CardFill# | StrokeWidth 1 | Stroke Color #CardStroke#

[MeterAlbumArtPlaceholder]
Meter=Shape
X=((20+#CardShiftX#)*#UiScale#)
Y=((28+#CardShiftY#)*#UiScale#)
Shape=Rectangle 0,0,(92*#UiScale#),(92*#UiScale#),(8*#UiScale#)| Fill Color #ColorCoverFill# | StrokeWidth 1 | Stroke Color #CardStroke#
DynamicVariables=1
MouseActionCursor=1
ToolTipText=Middle-click to refresh album art
MiddleMouseUpAction=[!CommandMeasure MeasureMedia "Control('refetchcover')"]

[MeterAlbumArtNote]
Meter=String
FontFace=#iconFont#
FontSize=(24*#UiScale#)
FontColor=#ColorCoverNote#
DynamicVariables=1
StringAlign=CenterCenter
AntiAlias=1
X=((66+#CardShiftX#)*#UiScale#)
Y=((74+#CardShiftY#)*#UiScale#)
Text="[\xEC4F]"

[MeterAlbumArtMask]
Meter=Shape
X=((20+#CardShiftX#)*#UiScale#)
Y=((28+#CardShiftY#)*#UiScale#)
Shape=Rectangle 0,0,(92*#UiScale#),(92*#UiScale#),(8*#UiScale#)| Fill Color 255,255,255,255 | StrokeWidth 0

[MeterAlbumArt]
Meter=Image
MeasureName=MeasureAlbumArt
Container=MeterAlbumArtMask
X=0
Y=0
W=(92*#UiScale#)
H=(92*#UiScale#)
PreserveAspectRatio=2
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Middle-click to refresh album art
MiddleMouseUpAction=[!CommandMeasure MeasureMedia "Control('refetchcover')"]
DynamicVariables=1

[MeterTrackTitle]
Meter=String
MeterStyle=StyleText
MeasureName=MeasurePlayer
X=((124+#CardShiftX#)*#UiScale#)
Y=((27+#CardShiftY#)*#UiScale#)
W=(192*#UiScale#)
H=(20*#UiScale#)
FontSize=(11*#UiScale#)
FontColor=#ColorPrimary#
FontWeight=700
ClipString=1
ToolTipText=[MeasurePlayer] - [MeasureArtist]#CRLF#Player: [MeasureSession]#CRLF#Middle-click: switch media player
SolidColor=0,0,0,1
LeftMouseUpAction=[!EnableMeasure MeasureOpenMusic][!UpdateMeasure MeasureOpenMusic][!DisableMeasure MeasureOpenMusic]
MiddleMouseUpAction=[!CommandMeasure MeasureMedia "Control('nextplayer')"]

[MeterArtistName]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureArtist
X=((124+#CardShiftX#)*#UiScale#)
Y=((47+#CardShiftY#)*#UiScale#)
W=(192*#UiScale#)
H=(16*#UiScale#)
FontSize=(9*#UiScale#)
FontColor=#ColorSecondary#
ClipString=1
SolidColor=0,0,0,1
LeftMouseUpAction=[!EnableMeasure MeasureOpenMusic][!UpdateMeasure MeasureOpenMusic][!DisableMeasure MeasureOpenMusic]

; --- Progress / Seek Bar ---

[MeterProgressBar]
Meter=Bar
MeasureName=MeasureProgress
X=((124+#CardShiftX#)*#UiScale#)
Y=((72+#CardShiftY#)*#UiScale#)
W=(192*#UiScale#)
H=(4*#UiScale#)
BarOrientation=Horizontal
BarColor=#ColorAccent#
SolidColor=#BarBack#
Group=MediaTimeline

[MeterTimeElapsed]
Meter=String
MeterStyle=StyleText
MeasureName=MeasurePosition
X=((124+#CardShiftX#)*#UiScale#)
Y=((79+#CardShiftY#)*#UiScale#)
FontSize=(8*#UiScale#)
FontColor=#ColorMuted#
Text="%1"
Group=MediaTimeline

[MeterTimeTotal]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureDuration
X=((316+#CardShiftX#)*#UiScale#)
Y=((79+#CardShiftY#)*#UiScale#)
FontSize=(8*#UiScale#)
FontColor=#ColorMuted#
StringAlign=Right
Text="%1"
Group=MediaTimeline

; --- Playback & Volume Controls ---

[MeterPrevButton]
Meter=String
MeterStyle=StyleIconBtn
X=((134+#CardShiftX#)*#UiScale#)
Y=((106+#CardShiftY#)*#UiScale#)
Text="[\xE892]"
ToolTipText=Previous Track
LeftMouseUpAction=[!CommandMeasure MeasureMedia "Control('prev')"]

[MeterPlayPauseButton]
Meter=String
MeterStyle=StyleIconBtn
MeasureName=MeasureState
X=((172+#CardShiftX#)*#UiScale#)
Y=((106+#CardShiftY#)*#UiScale#)
FontSize=(14*#UiScale#)
DynamicVariables=1
Text="%1"
ToolTipText=Play / Pause
LeftMouseUpAction=[!CommandMeasure MeasureMedia "Control('playpause')"]

[MeterNextButton]
Meter=String
MeterStyle=StyleIconBtn
X=((210+#CardShiftX#)*#UiScale#)
Y=((106+#CardShiftY#)*#UiScale#)
Text="[\xE893]"
ToolTipText=Next Track
LeftMouseUpAction=[!CommandMeasure MeasureMedia "Control('next')"]

[MeterVolIcon]
Meter=String
FontFace=#iconFont#
MeasureName=MeasureVolIcon
X=((280+#CardShiftX#)*#UiScale#)
Y=((106+#CardShiftY#)*#UiScale#)
StringAlign=RightCenter
FontSize=(9*#UiScale#)
FontColor=#ColorSecondary#
AntiAlias=1
DynamicVariables=1
SolidColor=0,0,0,1
MouseActionCursor=1
Text="%1"
LeftMouseUpAction=[!CommandMeasure MeasureVolumeRaw "ToggleMute"][!UpdateMeasure MeasureVolumeRaw][!UpdateMeasure MeasureVolume][!UpdateMeasure MeasureVolIcon][!UpdateMeter MeterVolume][!UpdateMeter #CURRENTSECTION#][!Redraw]
MiddleMouseUpAction=[!CommandMeasure MeasureVolumeRaw "ToggleNext"][!UpdateMeasure MeasureVolumeRaw][!UpdateMeasure MeasureVolume][!UpdateMeasure MeasureVolIcon][!UpdateMeter MeterVolume][!UpdateMeter #CURRENTSECTION#][!Redraw]
ToolTipText=Device: [MeasureVolumeRaw] | Scroll: Adjust Volume | Left-Click: Mute | Middle-Click: Switch Audio Device

[MeterVolume]
Meter=String
FontFace=#fontName#
MeasureName=MeasureVolume
X=((316+#CardShiftX#)*#UiScale#)
Y=((106+#CardShiftY#)*#UiScale#)
StringAlign=RightCenter
FontSize=(8*#UiScale#)
FontWeight=600
FontColor=#ColorSecondary#
AntiAlias=1
DynamicVariables=1
SolidColor=0,0,0,1
MouseActionCursor=1
Text="%1"
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "#ColorAccent#"][!SetOption MeterVolIcon FontColor "#ColorAccent#"][!UpdateMeter #CURRENTSECTION#][!UpdateMeter MeterVolIcon][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#ColorSecondary#"][!SetOption MeterVolIcon FontColor "#ColorSecondary#"][!UpdateMeter #CURRENTSECTION#][!UpdateMeter MeterVolIcon][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureVolumeRaw "ToggleMute"][!UpdateMeasure MeasureVolumeRaw][!UpdateMeasure MeasureVolume][!UpdateMeasure MeasureVolIcon][!UpdateMeter #CURRENTSECTION#][!UpdateMeter MeterVolIcon][!Redraw]
MiddleMouseUpAction=[!CommandMeasure MeasureVolumeRaw "ToggleNext"][!UpdateMeasure MeasureVolumeRaw][!UpdateMeasure MeasureVolume][!UpdateMeasure MeasureVolIcon][!UpdateMeter #CURRENTSECTION#][!UpdateMeter MeterVolIcon][!Redraw]
ToolTipText=Device: [MeasureVolumeRaw] | Scroll: Adjust Volume | Left-Click: Mute | Middle-Click: Switch Audio Device

[StyleSwitch]
FontFace=#fontName#
StringEffect=Shadow
FontEffectColor=0,0,0,80
AntiAlias=1
DynamicVariables=1
FontSize=(8*#UiScale#)
FontColor=#ColorSecondary#
SolidColor=#ColorSwitchFill#
W=(145*#UiScale#)
H=(14*#UiScale#)
Padding=0,(4*#UiScale#),0,(4*#UiScale#)
Y=((126+#CardShiftY#)*#UiScale#)
ClipString=1
MouseActionCursor=1

[MeterNextPlayer]
Meter=String
MeterStyle=StyleSwitch
MeasureName=MeasureSession
X=((20+#CardShiftX#)*#UiScale#)
Text="  Next player: %1"
ToolTipText=Left-click: switch player | Middle-click: lock player | Right-click: automatic player#CRLF#Current: [MeasureSession]
MiddleMouseUpAction=[!CommandMeasure MeasureMedia "Control('lockplayer')"]
RightMouseUpAction=[!CommandMeasure MeasureMedia "Control('resetplayer')"]
LeftMouseUpAction=[!CommandMeasure MeasureMedia "Control('nextplayer')"]

[MeterNextAudio]
Meter=String
MeterStyle=StyleSwitch
MeasureName=MeasureVolumeRaw
X=((171+#CardShiftX#)*#UiScale#)
Text="  Next audio: %1"
ToolTipText=Switch audio device | Current: [MeasureVolumeRaw]
LeftMouseUpAction=[!CommandMeasure MeasureVolumeRaw "ToggleNext"][!UpdateMeasure MeasureVolumeRaw][!UpdateMeasure MeasureVolume][!UpdateMeasure MeasureVolIcon][!UpdateMeter MeterVolume][!UpdateMeter MeterVolIcon][!UpdateMeter MeterNextAudio][!Redraw]

; Invisible 1px meter: reserves transparent padding so snapping to a screen edge leaves a gap
[MeterPad]
Meter=Shape
X=((#WideCardW#+#ActiveFrameW#-1)*#UiScale#)
Y=((#MediaCardH#+#ActiveFrameH#-1)*#UiScale#)
Shape=Rectangle 0,0,(1*#UiScale#),(1*#UiScale#)| Fill Color 0,0,0,1 | StrokeWidth 0

[MeterSeekTarget]
Meter=Image
Group=MediaTimeline
X=((124+#CardShiftX#)*#UiScale#)
Y=((66+#CardShiftY#)*#UiScale#)
W=(192*#UiScale#)
H=(14*#UiScale#)
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Click to seek (when supported by the player)
LeftMouseUpAction=[!CommandMeasure MeasureMedia "Control('seek', $MouseX:%$)"]
