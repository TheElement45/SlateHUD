[Rainmeter]
Group=SlateHUD
@IncludeContext=#@#Context.inc
RightMouseUpAction=[!CommandMeasure MeasureNotes "SuiteMenu()"]
Update=30000
DefaultUpdateDivider=-1
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
; Personal files must exist before any edit/tab action can use !WriteKeyValue.
OnRefreshAction=[!Draggable 0][!DisableMouseAction LeftMouseUpAction "*"][!SetOption meterHint MouseActionCursor 0][!SetOption meterHint LeftMouseUpAction ""][!SetOption meterHint Text "Preparing notes..."][!UpdateMeter meterHint][!Redraw][!CommandMeasure MeasureInitNotes "Run"][!CommandMeasure MeasureGameHub "DockNotes()" "#ROOTCONFIG#\Games"]
; Leaving the skin cancels any pending "clear page" confirmation and clears the hint line.
MouseLeaveAction=[!HideMeter meterConfirmLabel][!HideMeter meterConfirmDone][!HideMeter meterConfirmAll][!HideMeter meterConfirmCancel][!CommandMeasure MeasureNotes "ResetHint()"][!ShowMeter meterHint][!Redraw]

[Metadata]
Name=Notes
Author=Element
Information=Tasks with daily repeats, multi-page tabs, in-place editing and undo.
Version=2.4.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
; Fallback values used when the (git-ignored) personal data files do not exist yet.
@IncludeDefaults=#CURRENTPATH#Defaults.inc
@IncludeSettings=#CURRENTPATH#Settings.inc
@IncludeData=#CURRENTPATH#Data\Page#CurrentPage#.inc

; Active page file (saved atomically by Notes.lua)
PageFile=#CURRENTPATH#Data\Page#CurrentPage#.inc
NotesCardH=216
; Scratch variable that receives raw text typed into an inline input box
NewText=
; Sanitized display mirrors for INI measures/meters (updated by Notes.lua)
PageDisplayTitle=Page 1
NoteDisplay1=
NoteDisplay2=
NoteDisplay3=
NoteDisplay4=
NoteDisplay5=
; Recovery copies are saved per page in Data/*.inc.undo

; ------------------------------------------------------------------------------
; NOTES ON HOW THIS SKIN WORKS
;  * Formatting measures are on demand. Notes.lua checks the local date every 30 seconds;
;    daily tasks reset at DailyResetHour with disk writes only when needed.
;    Measures are refreshed on demand with !UpdateMeasure after a variable changes,
;    which avoids a full !Refresh (and its flicker) for edits / toggles / clears.
;  * Switching tabs still uses !Refresh because it has to re-read a different data file.
;  * Measures that must only run when a user acts are Disabled=1 and are triggered
;    with  !EnableMeasure -> !UpdateMeasure -> !DisableMeasure.
;  * Native ToolTipText is intentionally NOT used: moving the mouse quickly across
;    several meters made the tooltips stack on screen. A single hint line
;    ([meterHint]) at the bottom of the card is used instead.
; ------------------------------------------------------------------------------

; ------------------------------------------------------------------------------
; MEASURES - PERSONAL FILE INITIALIZATION
; Existing files are preserved. Defaults already provide the contents of new pages,
; so initialization needs no refresh (and cannot enter a refresh loop).
; ------------------------------------------------------------------------------

[MeasureNotes]
Measure=Script
ScriptFile=#@#Notes.lua
UpdateDivider=1

[MeasureInitNotes]
Measure=Plugin
Plugin=RunCommand
Program="#@#SlateHUDHelper.exe"
Parameter=initnotes
State=Hide
OutputType=UTF8
Timeout=5000
FinishAction=[!UpdateMeasure MeasureNotesReady]

[MeasureNotesReady]
Measure=String
String=[MeasureInitNotes]
DynamicVariables=1
UpdateDivider=-1
IfMatch=^READY$
IfMatchMode=1
IfMatchAction=[!EnableMouseAction * "*"][!SetOption meterHint MouseActionCursor 0][!SetOption meterHint LeftMouseUpAction ""][!SetOption meterHint Text "Right-click a task for options"][!CommandMeasure MeasureNotes "Ready()"][!UpdateMeter meterHint][!Redraw]
IfNotMatchAction=[!EnableMouseAction * "*"][!CommandMeasure MeasureNotes "FailReady()"][!UpdateMeter meterHint][!Redraw]

; ------------------------------------------------------------------------------
; MEASURES - TAB STYLING
; ------------------------------------------------------------------------------

[MeasureActiveTab]
Measure=Calc
Formula=#CurrentPage#
UpdateDivider=-1
IfCondition=MeasureActiveTab > 0
IfConditionMode=1
IfTrueAction=[!SetOption meterTab1 FontColor "#ColorMuted#"][!SetOption meterTab1 FontWeight "400"][!SetOption meterTab2 FontColor "#ColorMuted#"][!SetOption meterTab2 FontWeight "400"][!SetOption meterTab3 FontColor "#ColorMuted#"][!SetOption meterTab3 FontWeight "400"][!SetOption meterTab#CurrentPage# FontColor "#ColorAccent#"][!SetOption meterTab#CurrentPage# FontWeight "700"]

; ------------------------------------------------------------------------------
; MEASURES - PAGE TITLE INPUT
; ------------------------------------------------------------------------------

[MeasureInputTitle]
Measure=Plugin
Plugin=InputText
X=((24+#CardShiftX#)*#UiScale#)
Y=((29+#CardShiftY#)*#UiScale#)
W=(86*#UiScale#)
H=(18*#UiScale#)
FontFace=#fontName#
FontSize=#textSize#
FontColor=#ColorPrimary#
SolidColor=#ColorInputFill#
AntiAlias=1
FocusDismiss=1
; The padding spaces keep a typed quote character from touching the closing quotes.
Command1=[!SetVariable NewText """ $UserInput$ """][!EnableMeasure MeasureCommitTitle][!UpdateMeasure MeasureCommitTitle][!DisableMeasure MeasureCommitTitle]

; Sanitises (trim + quotes -> apostrophes) and saves the new page title. An empty title falls back to "Page N".
[MeasureCommitTitle]
Measure=String
String=#NewText#
DynamicVariables=1
UpdateDivider=-1
Disabled=1
RegExpSubstitute=1
Substitute='^\s+|\s+$':"",'"':"'"
IfMatch=^\s*$
IfMatchMode=1
IfMatchAction=[!CommandMeasure MeasureNotes "Save(0)"]
IfNotMatchAction=[!CommandMeasure MeasureNotes "Save(0)"]

; ------------------------------------------------------------------------------
; MEASURES - NOTE ROWS
; Per row N: MeasureInputN (inline editor), MeasureCommitN (sanitise), and
; MeasureNoteN / MeasureStatusN (formatting). Notes.lua handles saved mutations.
; ------------------------------------------------------------------------------
@IncludeRowMeasures=#CURRENTPATH#RowMeasures.inc

; Checkbox click: an empty row opens the editor instead of toggling a status that has no text.
[meterCard]
Meter=Shape
MeterStyle=styleCard
X=(#CardPadX#*#UiScale#)
Y=(#CardPadY#*#UiScale#)
; Moving onto blank card area clears the hint line unless initialization failed.
MouseOverAction=[!CommandMeasure MeasureNotes "ResetHint()"]
Shape=Rectangle 0,0,(#StatCardW#*#UiScale#),(#NotesCardH#*#UiScale#),(#CardRadius#*#UiScale#)| Fill Color #CardFill# | StrokeWidth 1 | Stroke Color #CardStroke#

[meterTitle]
Meter=String
X=((24+#CardShiftX#)*#UiScale#)
Y=((30+#CardShiftY#)*#UiScale#)
W=(70*#UiScale#)
H=(16*#UiScale#)
FontFace=#fontName#
FontSize=(9.5*#UiScale#)
FontWeight=700
FontColor=#ColorPrimary#
StringCase=Upper
StringEffect=Shadow
FontEffectColor=0,0,0,100
AntiAlias=1
ClipString=1
SolidColor=0,0,0,1
MouseActionCursor=1
DynamicVariables=1
Text=#PageDisplayTitle#
LeftMouseUpAction=[!CommandMeasure MeasureNotes "Edit(0)"]
RightMouseUpAction=["#PageFile#"]
MouseOverAction=[!SetOption meterTitle FontColor "#ColorAccent#"][!UpdateMeter meterTitle][!SetOption meterHint Text "Click: rename page  |  Right-click: open in Notepad"][!UpdateMeter meterHint][!Redraw]
MouseLeaveAction=[!SetOption meterTitle FontColor "#ColorPrimary#"][!UpdateMeter meterTitle][!Redraw]

; --- Tab Selectors ---
[meterTab1]
Meter=String
X=((110+#CardShiftX#)*#UiScale#)
Y=((30+#CardShiftY#)*#UiScale#)
W=(16*#UiScale#)
H=(18*#UiScale#)
FontFace=#fontName#
FontSize=(8*#UiScale#)
StringAlign=Center
StringEffect=Shadow
FontEffectColor=0,0,0,80
AntiAlias=1
SolidColor=0,0,0,1
MouseActionCursor=1
Text=1
LeftMouseUpAction=[!WriteKeyValue Variables CurrentPage 1 "#CURRENTPATH#Settings.inc"][!Refresh]
MouseOverAction=[!SetOption meterTab1 FontColor "#ColorPrimary#"][!UpdateMeter meterTab1][!SetOption meterHint Text "Switch to page 1"][!UpdateMeter meterHint][!Redraw]
MouseLeaveAction=[!UpdateMeasure MeasureActiveTab][!UpdateMeter meterTab1][!Redraw]

[meterTab2]
Meter=String
X=((128+#CardShiftX#)*#UiScale#)
Y=((30+#CardShiftY#)*#UiScale#)
W=(16*#UiScale#)
H=(18*#UiScale#)
FontFace=#fontName#
FontSize=(8*#UiScale#)
StringAlign=Center
StringEffect=Shadow
FontEffectColor=0,0,0,80
AntiAlias=1
SolidColor=0,0,0,1
MouseActionCursor=1
Text=2
LeftMouseUpAction=[!WriteKeyValue Variables CurrentPage 2 "#CURRENTPATH#Settings.inc"][!Refresh]
MouseOverAction=[!SetOption meterTab2 FontColor "#ColorPrimary#"][!UpdateMeter meterTab2][!SetOption meterHint Text "Switch to page 2"][!UpdateMeter meterHint][!Redraw]
MouseLeaveAction=[!UpdateMeasure MeasureActiveTab][!UpdateMeter meterTab2][!Redraw]

[meterTab3]
Meter=String
X=((146+#CardShiftX#)*#UiScale#)
Y=((30+#CardShiftY#)*#UiScale#)
W=(16*#UiScale#)
H=(18*#UiScale#)
FontFace=#fontName#
FontSize=(8*#UiScale#)
StringAlign=Center
StringEffect=Shadow
FontEffectColor=0,0,0,80
AntiAlias=1
SolidColor=0,0,0,1
MouseActionCursor=1
Text=3
LeftMouseUpAction=[!WriteKeyValue Variables CurrentPage 3 "#CURRENTPATH#Settings.inc"][!Refresh]
MouseOverAction=[!SetOption meterTab3 FontColor "#ColorPrimary#"][!UpdateMeter meterTab3][!SetOption meterHint Text "Switch to page 3"][!UpdateMeter meterHint][!Redraw]
MouseLeaveAction=[!UpdateMeasure MeasureActiveTab][!UpdateMeter meterTab3][!Redraw]

; --- Header Buttons ---
[meterBtnUndo]
Meter=String
X=((166+#CardShiftX#)*#UiScale#)
Y=((29+#CardShiftY#)*#UiScale#)
W=(16*#UiScale#)
H=(18*#UiScale#)
FontFace=#iconFont#
FontSize=(9*#UiScale#)
FontColor=#ColorAccent#
AntiAlias=1
SolidColor=0,0,0,1
MouseActionCursor=1
Hidden=1
DynamicVariables=1
Text="[\xE7A7]"
LeftMouseUpAction=[!CommandMeasure MeasureNotes "Undo()"]
MouseOverAction=[!SetOption meterBtnUndo FontColor "#ColorPrimary#"][!UpdateMeter meterBtnUndo][!SetOption meterHint Text "Undo / redo last change (saved for this page)"][!UpdateMeter meterHint][!Redraw]
MouseLeaveAction=[!SetOption meterBtnUndo FontColor "#ColorAccent#"][!UpdateMeter meterBtnUndo][!Redraw]

[meterBtnNotepad]
Meter=String
X=((186+#CardShiftX#)*#UiScale#)
Y=((29+#CardShiftY#)*#UiScale#)
W=(16*#UiScale#)
H=(18*#UiScale#)
FontFace=#iconFont#
FontSize=(9*#UiScale#)
FontColor=#ColorSecondary#
AntiAlias=1
SolidColor=0,0,0,1
MouseActionCursor=1
Text="[\xE70F]"
LeftMouseUpAction=["#PageFile#"]
MouseOverAction=[!SetOption meterBtnNotepad FontColor "#ColorAccent#"][!UpdateMeter meterBtnNotepad][!SetOption meterHint Text "Open this page in Notepad"][!UpdateMeter meterHint][!Redraw]
MouseLeaveAction=[!SetOption meterBtnNotepad FontColor "#ColorSecondary#"][!UpdateMeter meterBtnNotepad][!Redraw]

; Asks for confirmation (in the footer line) before anything is cleared.
[meterBtnClear]
Meter=String
X=((206+#CardShiftX#)*#UiScale#)
Y=((29+#CardShiftY#)*#UiScale#)
W=(16*#UiScale#)
H=(18*#UiScale#)
FontFace=#iconFont#
FontSize=(9*#UiScale#)
FontColor=#ColorSecondary#
AntiAlias=1
SolidColor=0,0,0,1
MouseActionCursor=1
Text="[\xE74D]"
LeftMouseUpAction=[!UpdateMeter meterConfirmDone][!UpdateMeter meterConfirmAll][!HideMeter meterHint][!ShowMeter meterConfirmLabel][!ShowMeter meterConfirmDone][!ShowMeter meterConfirmAll][!ShowMeter meterConfirmCancel][!Redraw]
MouseOverAction=[!SetOption meterBtnClear FontColor "#ColorCrit#"][!UpdateMeter meterBtnClear][!SetOption meterHint Text "Clear completed one-time tasks, or ALL tasks..."][!UpdateMeter meterHint][!Redraw]
MouseLeaveAction=[!SetOption meterBtnClear FontColor "#ColorSecondary#"][!UpdateMeter meterBtnClear][!Redraw]

[meterDivider]
Meter=Shape
Shape=Line ((24+#CardShiftX#)*#UiScale#),((50+#CardShiftY#)*#UiScale#),((214+#CardShiftX#)*#UiScale#),((50+#CardShiftY#)*#UiScale#)| StrokeWidth 1 | Stroke Color #ColorDivider#

; ------------------------------------------------------------------------------
; METERS - NOTE LINES
; ------------------------------------------------------------------------------

@IncludeRowMeters=#CURRENTPATH#RowMeters.inc

; ------------------------------------------------------------------------------
; METERS - FOOTER (hint line, replaces native tooltips; confirm buttons for clearing)
; ------------------------------------------------------------------------------

[meterHint]
Meter=String
X=((24+#CardShiftX#)*#UiScale#)
Y=((184+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(36*#UiScale#)
FontFace=#fontName#
FontSize=(7.5*#UiScale#)
FontColor=#ColorMuted#
StringEffect=Shadow
FontEffectColor=0,0,0,80
AntiAlias=1
ClipString=2
SolidColor=0,0,0,1
DynamicVariables=1
Text=Right-click a task for options
Substitute="":"Click to add a note"

[meterConfirmLabel]
Meter=String
X=((24+#CardShiftX#)*#UiScale#)
Y=((196+#CardShiftY#)*#UiScale#)
FontFace=#fontName#
FontSize=(7*#UiScale#)
FontWeight=700
FontColor=#ColorMuted#
AntiAlias=1
Hidden=1
Text=CLEAR:

[meterConfirmDone]
Meter=String
X=((62+#CardShiftX#)*#UiScale#)
Y=((196+#CardShiftY#)*#UiScale#)
H=(20*#UiScale#)
FontFace=#fontName#
FontSize=(7.5*#UiScale#)
FontWeight=700
FontColor=#ColorAccent#
AntiAlias=1
SolidColor=0,0,0,1
MouseActionCursor=1
Hidden=1
DynamicVariables=1
Text=COMPLETED
LeftMouseUpAction=[!CommandMeasure MeasureNotes "Clear('done')"]
MouseOverAction=[!SetOption meterConfirmDone FontColor "#ColorPrimary#"][!UpdateMeter meterConfirmDone][!Redraw]
MouseLeaveAction=[!SetOption meterConfirmDone FontColor "#ColorAccent#"][!UpdateMeter meterConfirmDone][!Redraw]

[meterConfirmAll]
Meter=String
X=((122+#CardShiftX#)*#UiScale#)
Y=((196+#CardShiftY#)*#UiScale#)
H=(20*#UiScale#)
FontFace=#fontName#
FontSize=(7.5*#UiScale#)
FontWeight=700
FontColor=#ColorCrit#
AntiAlias=1
SolidColor=0,0,0,1
MouseActionCursor=1
Hidden=1
DynamicVariables=1
Text=ALL
LeftMouseUpAction=[!CommandMeasure MeasureNotes "Clear('all')"]
MouseOverAction=[!SetOption meterConfirmAll FontColor "#ColorPrimary#"][!UpdateMeter meterConfirmAll][!Redraw]
MouseLeaveAction=[!SetOption meterConfirmAll FontColor "#ColorCrit#"][!UpdateMeter meterConfirmAll][!Redraw]

[meterConfirmCancel]
Meter=String
X=((156+#CardShiftX#)*#UiScale#)
Y=((196+#CardShiftY#)*#UiScale#)
H=(20*#UiScale#)
FontFace=#fontName#
FontSize=(7.5*#UiScale#)
FontWeight=700
FontColor=#ColorSecondary#
AntiAlias=1
SolidColor=0,0,0,1
MouseActionCursor=1
Hidden=1
Text=CANCEL
LeftMouseUpAction=[!HideMeter meterConfirmLabel][!HideMeter meterConfirmDone][!HideMeter meterConfirmAll][!HideMeter meterConfirmCancel][!SetOption meterHint Text "Right-click a task for options"][!UpdateMeter meterHint][!ShowMeter meterHint][!Redraw]
MouseOverAction=[!SetOption meterConfirmCancel FontColor "#ColorPrimary#"][!UpdateMeter meterConfirmCancel][!Redraw]
MouseLeaveAction=[!SetOption meterConfirmCancel FontColor "#ColorSecondary#"][!UpdateMeter meterConfirmCancel][!Redraw]

; --- Invisible padding meter so edge snapping leaves 8px gap ---
[meterPad]
Meter=Shape
X=((#StatCardW#+#ActiveFrameW#-(#BlurTightFrame#=1 ? 1 : 0))*#UiScale#)
Y=((#NotesCardH#+#ActiveFrameH#-(#BlurTightFrame#=1 ? 1 : 0))*#UiScale#)
Shape=Rectangle 0,0,(1*#UiScale#),(1*#UiScale#)| Fill Color 0,0,0,1 | StrokeWidth 0

[meterProgress]
Meter=String
MeterStyle=styleLeftText
X=((24+#CardShiftX#)*#UiScale#)
Y=((164+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(16*#UiScale#)
FontColor=#ColorSecondary#
Text=Click a row to add a task
