[Rainmeter]
Group=SlateHUD
@IncludeContext=#@#Context.inc
Update=2000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Battery
Author=Element
Information=Laptop battery charge, power source and time remaining. Hides itself on PCs without a battery.
Version=2.4.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
; BatteryCardH defaults to 110 in Variables.inc and can be overridden in UserSettings.inc
BatteryFillPct=0
BatteryFillColor=#ColorAccent#

; ----------------------------------
; MEASURES
; ----------------------------------

; Status is checked separately so the card hides on PCs without a battery.
[measureBattPct]
Measure=Plugin
Plugin=PowerPlugin
PowerState=PERCENT
MinValue=0
MaxValue=100
; Battery.lua owns the colors, including charging versus discharging.

[measureBattAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE

[measureBattStatus]
Measure=Plugin
Plugin=PowerPlugin
PowerState=STATUS

; Remaining time (string form is h:mm; unknown while charging).
[measureBattLife]
Measure=Plugin
Plugin=PowerPlugin
PowerState=LIFETIME

[measureBatteryDisplay]
Measure=Script
ScriptFile=#@#Battery.lua

; ----------------------------------
; METERS
; ----------------------------------

[meterCard]
Meter=Shape
Group=BatteryUI
MeterStyle=styleCard
X=(#CardPadX#*#UiScale#)
Y=(#CardPadY#*#UiScale#)
Shape=Rectangle 0,0,(#StatCardW#*#UiScale#),(#BatteryCardH#*#UiScale#),(#CardRadius#*#UiScale#)| Fill Color #CardFill# | StrokeWidth 1 | Stroke Color #CardStroke#

[meterTitle]
Meter=String
Group=BatteryUI
MeterStyle=styleTitle
X=((119+#CardShiftX#)*#UiScale#)
Y=((32+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(18*#UiScale#)
Text=Battery
LeftMouseUpAction=["ms-settings:batterysaver"]
ToolTipText=Open Windows battery settings

[meterLabelBattPct]
Meter=String
Group=BatteryUI
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((62+#CardShiftY#)*#UiScale#)
W=(62*#UiScale#)
H=(14*#UiScale#)
Text=Charge

[meterValueBattPct]
Meter=String
Group=BatteryUI
MeterStyle=styleRightText
MeasureName=measureBattPct
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(118*#UiScale#)
H=(14*#UiScale#)
NumOfDecimals=0
Text=%1%

[meterBarBatt]
Meter=Bar
Group=BatteryUI
MeterStyle=styleBar
MeasureName=measureBattPct
X=((26+#CardShiftX#)*#UiScale#)
Y=((78+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)

[meterLabelBattAC]
Meter=String
Group=BatteryUI
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((82+#CardShiftY#)*#UiScale#)
W=(62*#UiScale#)
H=(14*#UiScale#)
Text=Power

[meterValueBattAC]
Meter=String
Group=BatteryUI
MeterStyle=styleRightText
MeasureName=measureBattAC
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(118*#UiScale#)
H=(14*#UiScale#)
Text=%1

[meterLabelBattLife]
Meter=String
Group=BatteryUI
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((102+#CardShiftY#)*#UiScale#)
W=(62*#UiScale#)
H=(14*#UiScale#)
Text=Time left

[meterValueBattLife]
Meter=String
Group=BatteryUI
MeterStyle=styleRightText
MeasureName=measureBattLife
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(118*#UiScale#)
H=(14*#UiScale#)
Text=%1

; Invisible 1px meter: reserves transparent padding so snapping to a screen edge leaves a gap
[MeterPad]
Meter=Shape
X=((#StatCardW#+#ActiveFrameW#-1)*#UiScale#)
Y=((#BatteryCardH#+#ActiveFrameH#-1)*#UiScale#)
Shape=Rectangle 0,0,(1*#UiScale#),(1*#UiScale#)| Fill Color 0,0,0,1 | StrokeWidth 0

[meterBatteryIcon]
Meter=Shape
Group=BatteryUI
X=((196+#CardShiftX#)*#UiScale#)
Y=((36+#CardShiftY#)*#UiScale#)
Shape=Rectangle 0,0,(14*#UiScale#),(8*#UiScale#),(1.5*#UiScale#) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #ColorSecondary#
Shape2=Rectangle (14*#UiScale#),(2*#UiScale#),(2*#UiScale#),(4*#UiScale#) | Fill Color #ColorSecondary# | StrokeWidth 0
Shape3=Rectangle (2*#UiScale#),(2*#UiScale#),((#BatteryFillPct#/100*10)*#UiScale#),(4*#UiScale#) | Fill Color #BatteryFillColor# | StrokeWidth 0
DynamicVariables=1
ToolTipText=Battery charge
