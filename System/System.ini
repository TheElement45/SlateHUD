[Rainmeter]
Group=SlateHUD
@IncludeContext=#@#Context.inc
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Draggable 0][!CommandMeasure MeasureHelperWatchdog "Check()"]
ContextTitle19=---
ContextAction19=[]
ContextTitle20=Toggle CPU/GPU history (Off)
ContextAction20=[!CommandMeasure measureSystem "ToggleHistory()"]
ContextTitle21=Toggle UI animations (Off)
ContextAction21=[!CommandMeasure measureSystem "ToggleAnimations()"]
ContextTitle22=Toggle LHM sensors (Off)
ContextAction22=[!CommandMeasure measureSystem "ToggleLhm()"]
ContextTitle23=GPU sensor priority: Auto
ContextAction23=[!CommandMeasure measureSystem "CycleSensorProvider()"]

[Metadata]
Name=System
Author=Element
Information=CPU, NVIDIA/LibreHardwareMonitor telemetry, VRAM, RAM and pagefile usage.
Version=2.4.0
License=MIT

[Variables]
@Include=#@#Variables.inc

@Include2=#@#Styles.inc

; Runtime GPU values, published only after validation by System.lua.
GpuUsage=0
GpuMemoryPct=0

; ----------------------------------
; MEASURES
; ----------------------------------

[measureCPU]
Measure=CPU
Processor=0

[measureRAM]
Measure=PhysicalMemory
UpdateDivider=2

[measureRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=2

[measureRAMUsedGB]
Measure=Calc
Formula=measureRAM / 1073741824
UpdateDivider=2
DynamicVariables=1

[measureRAMTotalGB]
Measure=Calc
Formula=measureRAMTotal / 1073741824
UpdateDivider=2
DynamicVariables=1

[measureRAMPct]
Measure=Calc
Formula=(measureRAM / Max(measureRAMTotal, 1)) * 100
UpdateDivider=2
DynamicVariables=1

[measureSWAP]
Measure=Plugin
Plugin=UsageMonitor
Category=Paging File
Counter=% Usage
Name=_Total
UpdateDivider=2
MinValue=0
MaxValue=100

[measureSWAPPct]
Measure=Calc
Formula=Clamp(measureSWAP, 0, 100)
UpdateDivider=2
DynamicVariables=1
MinValue=0
MaxValue=100

; Runs the shared singleton background helper (also monitored by NowPlaying.ini).
; Exits immediately if another instance is already running, and exits when Rainmeter does.
[MeasureHelper]
Measure=Plugin
Plugin=RunCommand
Program="#@#SlateHUDHelper.exe"
Parameter=ensure
State=Hide
Timeout=2000

[MeasureHealthBridge]
Measure=Plugin
Plugin=SlateHUD
Stream=HelperHealth
FallbackPath=#@#Cache\helper-health.txt
UpdateDivider=5

[MeasureMonitorsBridge]
Measure=Plugin
Plugin=SlateHUD
Stream=Monitors
FallbackPath=#@#Cache\monitors.txt

[MeasureGpuBridge]
Measure=Plugin
Plugin=SlateHUD
Stream=Gpu
FallbackPath=#@#Cache\gpu.txt

[MeasureHelperWatchdog]
Measure=Script
ScriptFile=#@#HelperWatchdog.lua
UpdateDivider=5

[MeasureLayout]
Measure=Script
ScriptFile=#@#Layout.lua

[measureSystem]
Measure=Script
ScriptFile=#@#System.lua

[measureGPU]
Measure=Calc
Formula=#GpuUsage#
DynamicVariables=1
MinValue=0
MaxValue=100

[measureVRAMPct]
Measure=Calc
Formula=#GpuMemoryPct#
DynamicVariables=1
MinValue=0
MaxValue=100

; ----------------------------------
; METERS
; ----------------------------------

[meterCard]
Meter=Shape
MeterStyle=styleCard
X=(#CardPadX#*#UiScale#)
Y=(#CardPadY#*#UiScale#)
Shape=Rectangle 0,0,(#StatCardW#*#UiScale#),((#StatCardH#+40*#SysHistory#)*#UiScale#),(#CardRadius#*#UiScale#)| Fill Color #CardFill# | StrokeWidth 1 | Stroke Color #CardStroke#

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=((119+#CardShiftX#)*#UiScale#)
Y=((32+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(18*#UiScale#)
Text=System
LeftMouseUpAction=["taskmgr.exe"]
ToolTipText=Click: Task Manager | Middle-click: wrap / automatic layout | Right-click: realign
MiddleMouseUpAction=[!CommandMeasure MeasureLayout "Toggle()"]
RightMouseUpAction=[!CommandMeasure MeasureLayout "Apply()"]

[meterLabelCPU]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((62+#CardShiftY#)*#UiScale#)
W=(46*#UiScale#)
H=(14*#UiScale#)
Text=CPU

[meterValueCPU]
Meter=String
MeterStyle=styleRightText
MeasureName=measureCPU
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(134*#UiScale#)
H=(14*#UiScale#)
Text=%1%

[meterBarCPU]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureCPU
X=((26+#CardShiftX#)*#UiScale#)
Y=((78+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)

[meterLabelGPU]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((82+#CardShiftY#)*#UiScale#)
W=(46*#UiScale#)
H=(14*#UiScale#)
Text=GPU

[meterValueGPU]
Meter=String
MeterStyle=styleRightText
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(134*#UiScale#)
H=(14*#UiScale#)
NumOfDecimals=0
DynamicVariables=1
Text=Checking...

[meterBarGPU]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureGPU
X=((26+#CardShiftX#)*#UiScale#)
Y=((98+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)

[meterLabelVRAM]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((102+#CardShiftY#)*#UiScale#)
W=(46*#UiScale#)
H=(14*#UiScale#)
Text=VRAM

[meterValueVRAM]
Meter=String
MeterStyle=styleRightText
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(134*#UiScale#)
H=(14*#UiScale#)
NumOfDecimals=1
Text=Checking...

[meterBarVRAM]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureVRAMPct
X=((26+#CardShiftX#)*#UiScale#)
Y=((118+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)

[meterLabelRAM]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((122+#CardShiftY#)*#UiScale#)
W=(46*#UiScale#)
H=(14*#UiScale#)
Text=RAM

[meterValueRAM]
Meter=String
MeterStyle=styleRightText
MeasureName=measureRAMPct
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(134*#UiScale#)
H=(14*#UiScale#)
DynamicVariables=1
Text=[measureRAMPct:0]% ([measureRAMUsedGB:1] / [measureRAMTotalGB:1] GB)

[meterBarRAM]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureRAM
X=((26+#CardShiftX#)*#UiScale#)
Y=((138+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)

[meterLabelSWAP]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((142+#CardShiftY#)*#UiScale#)
W=(46*#UiScale#)
H=(14*#UiScale#)
Text=Pagefile
ToolTipText=Pagefile usage only (excludes physical RAM)

[meterValueSWAP]
Meter=String
MeterStyle=styleRightText
MeasureName=measureSWAPPct
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(134*#UiScale#)
H=(14*#UiScale#)
DynamicVariables=1
Text=[measureSWAPPct:0]%
ToolTipText=Pagefile usage only (excludes physical RAM)

[meterBarSWAP]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureSWAPPct
X=((26+#CardShiftX#)*#UiScale#)
Y=((158+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)

; Invisible 1px meter: reserves transparent padding so snapping to a screen edge leaves a gap
[MeterPad]
Meter=Shape
X=((#StatCardW#+#ActiveFrameW#-1)*#UiScale#)
Y=((#StatCardH#+#ActiveFrameH#-1+40*#SysHistory#)*#UiScale#)
Shape=Rectangle 0,0,(1*#UiScale#),(1*#UiScale#)| Fill Color 0,0,0,1 | StrokeWidth 0

[meterMemoryDivider]
Meter=Shape
Shape=Line ((26+#CardShiftX#)*#UiScale#),((101+#CardShiftY#)*#UiScale#),((216+#CardShiftX#)*#UiScale#),((101+#CardShiftY#)*#UiScale#)| StrokeWidth 1 | Stroke Color #ColorDivider#

[meterHistoryLabel]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((176+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(14*#UiScale#)
Text=Recent load (CPU / GPU)
FontColor=#ColorSecondary#
Hidden=(1-#SysHistory#)

[meterHistory]
Meter=Line
MeasureName=measureCPU
MeasureName2=measureGPU
X=((26+#CardShiftX#)*#UiScale#)
Y=((192+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(18*#UiScale#)
LineCount=2
LineColor=#ColorAccent#
LineColor2=#ColorHistory2#
LineWidth=1
AntiAlias=1
Hidden=(1-#SysHistory#)
