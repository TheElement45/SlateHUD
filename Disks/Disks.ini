[Rainmeter]
Group=SlateHUD
@IncludeContext=#@#Context.inc
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Disks
Author=Element
Information=Storage usage for C:, D:, E: and live disk read/write.
Version=2.4.0
License=MIT

[Variables]
@Include=#@#Variables.inc
; disk1..disk3 defaults live in Variables.inc and can be overridden in UserSettings.inc
@Include2=#@#Styles.inc

; ----------------------------------
; MEASURES - DISK C
; ----------------------------------

[measureTotalDiskC]
Measure=FreeDiskSpace
Drive=#disk1#
Total=1
Label=1
UpdateDivider=5

[measureFreeDiskC]
Measure=FreeDiskSpace
Drive=#disk1#
UpdateDivider=5

[measureUsedDiskC]
Measure=FreeDiskSpace
Drive=#disk1#
InvertMeasure=1
UpdateDivider=5

[measurePercentDiskC]
Measure=Calc
Formula=Round((measureUsedDiskC / Max(measureTotalDiskC, 1)) * 100)
MinValue=0
MaxValue=100

; ----------------------------------
; MEASURES - DISK D
; ----------------------------------

[measureTotalDiskD]
Measure=FreeDiskSpace
Drive=#disk2#
Total=1
Label=1
UpdateDivider=5

[measureFreeDiskD]
Measure=FreeDiskSpace
Drive=#disk2#
UpdateDivider=5

[measureUsedDiskD]
Measure=FreeDiskSpace
Drive=#disk2#
InvertMeasure=1
UpdateDivider=5

[measurePercentDiskD]
Measure=Calc
Formula=Round((measureUsedDiskD / Max(measureTotalDiskD, 1)) * 100)
MinValue=0
MaxValue=100

; ----------------------------------
; MEASURES - DISK E
; ----------------------------------

[measureTotalDiskE]
Measure=FreeDiskSpace
Drive=#disk3#
Total=1
Label=1
UpdateDivider=5

[measureFreeDiskE]
Measure=FreeDiskSpace
Drive=#disk3#
UpdateDivider=5

[measureUsedDiskE]
Measure=FreeDiskSpace
Drive=#disk3#
InvertMeasure=1
UpdateDivider=5

[measurePercentDiskE]
Measure=Calc
Formula=Round((measureUsedDiskE / Max(measureTotalDiskE, 1)) * 100)
MinValue=0
MaxValue=100

; ----------------------------------
; MEASURES - REAL-TIME DISK I/O
; ----------------------------------

[measureDiskRead]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Read Bytes/sec
Name=_Total
MinValue=0
MaxValue=#DiskActivityMax#

[measureDiskReadBytes]
Measure=Calc
Formula=measureDiskRead
MinValue=0
MaxValue=#DiskActivityMax#

[measureDiskWrite]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Write Bytes/sec
Name=_Total
MinValue=0
MaxValue=#DiskActivityMax#

[measureDiskWriteBytes]
Measure=Calc
Formula=measureDiskWrite
MinValue=0
MaxValue=#DiskActivityMax#

; ----------------------------------
; METERS
; ----------------------------------

[MeasureDriveStatus]
Measure=Script
ScriptFile=#@#Disks.lua
UpdateDivider=5

[meterCard]
Meter=Shape
MeterStyle=styleCard
X=(#CardPadX#*#UiScale#)
Y=(#CardPadY#*#UiScale#)

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=((119+#CardShiftX#)*#UiScale#)
Y=((32+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(18*#UiScale#)
Text=Disks
LeftMouseUpAction=["shell:MyComputerFolder"]
ToolTipText=Open This PC

; --- DRIVE C ---

[meterLabelDiskC]
Meter=String
MeterStyle=styleLeftText
MeasureName=measureTotalDiskC
X=((26+#CardShiftX#)*#UiScale#)
Y=((62+#CardShiftY#)*#UiScale#)
W=(101*#UiScale#)
H=(14*#UiScale#)
Text=#disk1#\ %1
LeftMouseUpAction=["#disk1#\"]
ToolTipText=#disk1#\ [measureTotalDiskC]
DynamicVariables=1

[meterValueDiskC]
Meter=String
MeterStyle=styleRightText
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(84*#UiScale#)
H=(14*#UiScale#)
Text=Not present
ToolTipText=[measurePercentDiskC:0]% used | [measureUsedDiskC:/1000000000,1] / [measureTotalDiskC:/1000000000,1] GB
DynamicVariables=1

[meterBarDiskC]
Meter=Bar
MeterStyle=styleBar
MeasureName=measurePercentDiskC
X=((26+#CardShiftX#)*#UiScale#)
Y=((78+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)

; --- DRIVE D ---

[meterLabelDiskD]
Meter=String
MeterStyle=styleLeftText
MeasureName=measureTotalDiskD
X=((26+#CardShiftX#)*#UiScale#)
Y=((82+#CardShiftY#)*#UiScale#)
W=(101*#UiScale#)
H=(14*#UiScale#)
Text=#disk2#\ %1
LeftMouseUpAction=["#disk2#\"]
ToolTipText=#disk2#\ [measureTotalDiskD]
DynamicVariables=1

[meterValueDiskD]
Meter=String
MeterStyle=styleRightText
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(84*#UiScale#)
H=(14*#UiScale#)
Text=Not present
ToolTipText=[measurePercentDiskD:0]% used | [measureUsedDiskD:/1000000000,1] / [measureTotalDiskD:/1000000000,1] GB
DynamicVariables=1

[meterBarDiskD]
Meter=Bar
MeterStyle=styleBar
MeasureName=measurePercentDiskD
X=((26+#CardShiftX#)*#UiScale#)
Y=((98+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)

; --- DRIVE E ---

[meterLabelDiskE]
Meter=String
MeterStyle=styleLeftText
MeasureName=measureTotalDiskE
X=((26+#CardShiftX#)*#UiScale#)
Y=((102+#CardShiftY#)*#UiScale#)
W=(101*#UiScale#)
H=(14*#UiScale#)
Text=#disk3#\ %1
LeftMouseUpAction=["#disk3#\"]
ToolTipText=#disk3#\ [measureTotalDiskE]
DynamicVariables=1

[meterValueDiskE]
Meter=String
MeterStyle=styleRightText
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(84*#UiScale#)
H=(14*#UiScale#)
Text=Not present
ToolTipText=[measurePercentDiskE:0]% used | [measureUsedDiskE:/1000000000,1] / [measureTotalDiskE:/1000000000,1] GB
DynamicVariables=1

[meterBarDiskE]
Meter=Bar
MeterStyle=styleBar
MeasureName=measurePercentDiskE
X=((26+#CardShiftX#)*#UiScale#)
Y=((118+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)

; --- DISK READ ACTIVITY ---

[meterLabelRead]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((122+#CardShiftY#)*#UiScale#)
W=(68*#UiScale#)
H=(14*#UiScale#)
Text=Read (all)

[meterValueRead]
Meter=String
MeterStyle=styleRightText
MeasureName=measureDiskReadBytes
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(118*#UiScale#)
H=(14*#UiScale#)
Text=%1B/s
AutoScale=1
NumOfDecimals=1

[meterBarRead]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureDiskReadBytes
X=((26+#CardShiftX#)*#UiScale#)
Y=((138+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)

; --- DISK WRITE ACTIVITY ---

[meterLabelWrite]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((142+#CardShiftY#)*#UiScale#)
W=(68*#UiScale#)
H=(14*#UiScale#)
Text=Write (all)

[meterValueWrite]
Meter=String
MeterStyle=styleRightText
MeasureName=measureDiskWriteBytes
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(118*#UiScale#)
H=(14*#UiScale#)
Text=%1B/s
AutoScale=1
NumOfDecimals=1

[meterBarWrite]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureDiskWriteBytes
X=((26+#CardShiftX#)*#UiScale#)
Y=((158+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)

; Invisible 1px meter: reserves transparent padding so snapping to a screen edge leaves a gap
[MeterPad]
Meter=Shape
X=((#StatCardW#+#ActiveFrameW#-1)*#UiScale#)
Y=((#StatCardH#+#ActiveFrameH#-1)*#UiScale#)
Shape=Rectangle 0,0,(1*#UiScale#),(1*#UiScale#)| Fill Color 0,0,0,1 | StrokeWidth 0

[meterActivityDivider]
Meter=Shape
Shape=Line ((26+#CardShiftX#)*#UiScale#),((120+#CardShiftY#)*#UiScale#),((216+#CardShiftX#)*#UiScale#),((120+#CardShiftY#)*#UiScale#)| StrokeWidth 1 | Stroke Color #ColorDivider#
