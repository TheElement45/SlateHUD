[Rainmeter]
Group=SlateHUD
@IncludeContext=#@#Context.inc
; All updates are driven by interaction and scan completion.
Update=-1
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!Draggable 0][!CommandMeasure MeasureApps "Setup()"]
MouseScrollUpAction=[!CommandMeasure MeasureApps "ChangePage(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureApps "ChangePage(1)"]
RightMouseUpAction=[!CommandMeasure MeasureApps "SuiteMenu()"]
MouseLeaveAction=[!CommandMeasure MeasureApps "ResetHover()"]
; Use one in-card hover hint instead of a native popup for every meter.
ToolTipHidden=1

[Metadata]
Name=Apps Launcher
Author=Element
Information=Searchable app launcher with eight favorites, app menus and expandable groups.
License=MIT
Version=2.4.0

[Variables]
@Include=#@#Variables.inc
AppCount=0
AppCardH=388
AppsOpenCategory=
AppsSearchInput=
@IncludeView=#CURRENTPATH#View.inc

[MeasureApps]
Measure=Script
ScriptFile=#@#Apps.lua

[MeasureScanApps]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#ScanApps.ps1"
State=Hide
Timeout=45000
OutputType=UTF8
UpdateDivider=-1
FinishAction=[!CommandMeasure MeasureApps "FinishScan()"]

[MeasureAnimPower]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE
UpdateDivider=-1

[MeasureHoverAnim]
Measure=Plugin
Plugin=ActionTimer
IgnoreWarnings=1
ActionList1=Repeat Step, 24, 4
Step=[!CommandMeasure MeasureApps "AnimStep()"]
UpdateDivider=-1

[StyleAppHit]
SolidColor=0,0,0,1
MouseActionCursor=1
DynamicVariables=1
Hidden=1

[StyleAppLabel]
FontFace=#fontName#
FontSize=(8.5*#UiScale#)
FontColor=#ColorSecondary#
StringEffect=Shadow
FontEffectColor=0,0,0,80
AntiAlias=1
StringAlign=Center
ClipString=1
DynamicVariables=1
Hidden=1

[StyleAppCategory]
FontFace=#fontName#
FontSize=(7.5*#UiScale#)
FontWeight=500
FontColor=#ColorSecondary#
StringEffect=Shadow
FontEffectColor=0,0,0,80
AntiAlias=1
ClipString=1
X=((24+#CardShiftX#)*#UiScale#)
W=(130*#UiScale#)
H=(16*#UiScale#)
Padding=(5*#UiScale#),(4*#UiScale#),(5*#UiScale#),(4*#UiScale#)
SolidColor=#ColorPill#
MouseActionCursor=1
DynamicVariables=1
MouseOverAction=[!CommandMeasure MeasureApps "HoverControl('#CURRENTSECTION#')"]
MouseLeaveAction=[!CommandMeasure MeasureApps "LeaveControl('#CURRENTSECTION#')"]

[MeterBackground]
Meter=Shape
X=(#CardPadX#*#UiScale#)
Y=(#CardPadY#*#UiScale#)
Shape=Rectangle 0,0,(#WideCardW#*#UiScale#),(#AppCardH#*#UiScale#),(#CardRadius#*#UiScale#) | Fill Color #CardFill# | StrokeWidth 1 | Stroke Color #CardStroke#
DynamicVariables=1

[MeterTitle]
Meter=String
FontFace=#fontName#
FontSize=(10.5*#UiScale#)
FontWeight=700
FontColor=#ColorPrimary#
AntiAlias=1
X=((24+#CardShiftX#)*#UiScale#)
Y=((29+#CardShiftY#)*#UiScale#)
Text=APPS

[MeterRescan]
Meter=String
MeterStyle=StyleAppCategory
X=((312+#CardShiftX#)*#UiScale#)
Y=((31+#CardShiftY#)*#UiScale#)
W=(60*#UiScale#)
H=(20*#UiScale#)
Padding=0,0,0,0
FontSize=(7*#UiScale#)
SolidColor=0,0,0,1
StringAlign=Right
Text=REFRESH
ToolTipText=Discover new shortcuts in Desktop\Apps and refresh app icons
LeftMouseUpAction=[!CommandMeasure MeasureApps "Scan()"]

[MeterRule]
Meter=Shape
X=((24+#CardShiftX#)*#UiScale#)
Y=((55+#CardShiftY#)*#UiScale#)
Shape=Line 0,0,(288*#UiScale#),0 | Stroke Color #ColorDivider# | StrokeWidth 1

[MeterSearch]
Meter=String
MeterStyle=StyleAppCategory
X=((24+#CardShiftX#)*#UiScale#)
Y=((58+#CardShiftY#)*#UiScale#)
W=(288*#UiScale#)
H=(14*#UiScale#)
Padding=0,(4*#UiScale#),0,(4*#UiScale#)
FontSize=(8*#UiScale#)
ClipString=1
Text=  Search apps...
ToolTipText=Search all apps by name; press Enter to apply. Right-click to clear.
LeftMouseUpAction=[!CommandMeasure MeasureApps "EditSearch()"]
RightMouseUpAction=[!CommandMeasure MeasureApps "ClearSearch()"]

[MeterClearSearch]
Meter=String
MeterStyle=StyleAppCategory
X=((288+#CardShiftX#)*#UiScale#)
Y=((58+#CardShiftY#)*#UiScale#)
W=(24*#UiScale#)
H=(14*#UiScale#)
Padding=0,(4*#UiScale#),0,(4*#UiScale#)
FontSize=(8*#UiScale#)
Text= x
Hidden=1
ToolTipText=Clear search
LeftMouseUpAction=[!CommandMeasure MeasureApps "ClearSearch()"]
RightMouseUpAction=[!CommandMeasure MeasureApps "ClearSearch()"]

[MeasureSearch]
Measure=Plugin
Plugin=InputText
X=((24+#CardShiftX#)*#UiScale#)
Y=((58+#CardShiftY#)*#UiScale#)
W=(288*#UiScale#)
H=(24*#UiScale#)
FontFace=#fontName#
FontSize=(9*#UiScale#)
FontColor=#ColorPrimary#
SolidColor=#ColorInputFill#
FocusDismiss=1
InputLimit=120
Command1=[!SetVariable AppsSearchInput """ $UserInput$ """][!UpdateMeasure MeasureSearchValue][!CommandMeasure MeasureApps "Filter()"]

[MeasureSearchValue]
Measure=String
String=#AppsSearchInput#
DynamicVariables=1
UpdateDivider=-1
RegExpSubstitute=1
Substitute='^\s+|\s+$':"",'"':"'"

[MeterFavorites]
Meter=String
MeterStyle=StyleAppLabel
Hidden=0
StringAlign=Left
X=((24+#CardShiftX#)*#UiScale#)
Y=((88+#CardShiftY#)*#UiScale#)
W=(288*#UiScale#)
H=(16*#UiScale#)
FontSize=(7.5*#UiScale#)
FontColor=#ColorMuted#
Text=FAVORITES

[MeterEmpty]
Meter=String
MeterStyle=StyleAppLabel
StringAlign=Left
W=(288*#UiScale#)
H=(44*#UiScale#)
Text=No apps yet.

[MeterCategory1]
Meter=String
MeterStyle=StyleAppCategory
LeftMouseUpAction=[!CommandMeasure MeasureApps "Toggle('Communication')"]

[MeterCategory2]
Meter=String
MeterStyle=StyleAppCategory
LeftMouseUpAction=[!CommandMeasure MeasureApps "Toggle('Development')"]

[MeterCategory3]
Meter=String
MeterStyle=StyleAppCategory
LeftMouseUpAction=[!CommandMeasure MeasureApps "Toggle('Creative')"]

[MeterCategory4]
Meter=String
MeterStyle=StyleAppCategory
LeftMouseUpAction=[!CommandMeasure MeasureApps "Toggle('Utilities')"]

[MeterCategory5]
Meter=String
MeterStyle=StyleAppCategory
LeftMouseUpAction=[!CommandMeasure MeasureApps "Toggle('System')"]

[MeterCategory6]
Meter=String
MeterStyle=StyleAppCategory
LeftMouseUpAction=[!CommandMeasure MeasureApps "Toggle('Productivity')"]

[MeterFooter]
Meter=String
MeterStyle=StyleAppLabel
Hidden=0
StringAlign=Left
X=((24+#CardShiftX#)*#UiScale#)
W=(140*#UiScale#)
H=(18*#UiScale#)
FontSize=(8*#UiScale#)
FontColor=#ColorMuted#
Text=Open Apps folder
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Open the folder containing your app shortcuts
LeftMouseUpAction=[!CommandMeasure MeasureApps "OpenFolder()"]
MouseOverAction=[!CommandMeasure MeasureApps "HoverControl('#CURRENTSECTION#')"]
MouseLeaveAction=[!CommandMeasure MeasureApps "LeaveControl('#CURRENTSECTION#')"]

[MeterHint]
Meter=String
MeterStyle=StyleAppLabel
Hidden=0
StringAlign=Left
X=((24+#CardShiftX#)*#UiScale#)
W=(288*#UiScale#)
H=(16*#UiScale#)
FontSize=(7.5*#UiScale#)
FontColor=#ColorMuted#
Text=Right-click an app for options

[StyleAppPager]
MeterStyle=StyleAppLabel
FontFace=#fontName#
FontSize=(8*#UiScale#)
FontColor=#ColorSecondary#
AntiAlias=1
Hidden=1
DynamicVariables=1
W=(24*#UiScale#)
H=(18*#UiScale#)
SolidColor=0,0,0,1
MouseActionCursor=1
MouseOverAction=[!CommandMeasure MeasureApps "HoverControl('#CURRENTSECTION#')"]
MouseLeaveAction=[!CommandMeasure MeasureApps "LeaveControl('#CURRENTSECTION#')"]

[MeterPrev]
Meter=String
MeterStyle=StyleAppPager
X=((200+#CardShiftX#)*#UiScale#)
Text=<
ToolTipText=Previous page / scroll up
LeftMouseUpAction=[!CommandMeasure MeasureApps "ChangePage(-1)"]

[MeterPage]
Meter=String
MeterStyle=StyleAppPager
X=((250+#CardShiftX#)*#UiScale#)
W=(44*#UiScale#)
StringAlign=Center

[MeterNext]
Meter=String
MeterStyle=StyleAppPager
X=((296+#CardShiftX#)*#UiScale#)
Text=>
ToolTipText=Next page / scroll down
LeftMouseUpAction=[!CommandMeasure MeasureApps "ChangePage(1)"]

; Generated variables and icon meters. Refresh rebuilds only this file and the icon cache.
@IncludeCatalog=#CURRENTPATH#Catalog.inc

[MeterPad]
Meter=Image
X=((#WideCardW#+#ActiveFrameW#-1)*#UiScale#)
Y=((#AppCardH#+#ActiveFrameH#-1)*#UiScale#)
W=1
H=1
SolidColor=0,0,0,1
DynamicVariables=1
