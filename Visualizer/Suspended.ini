[Rainmeter]
Group=SlateHUD
@IncludeContext=#@#Context.inc
Update=1000
DefaultUpdateDivider=-1
AccurateText=1
DynamicWindowSize=0
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!Draggable 0][!CommandMeasure MeasureVisualState "Setup()"]

[Metadata]
Name=Horizontal Audio Visualizer (Fullscreen)
Author=Element
Information=Static visualizer while a fullscreen app is using the external display.
License=MIT
Version=2.4.0

[Variables]
@Include=#@#Variables.inc
VisualMode=3

; This variant has no AudioLevel measures. Activating it releases audio analysis.
[MeasureVisualState]
Measure=Script
ScriptFile=#@#Visualizer.lua
UpdateDivider=1

[MeterBackground]
Meter=Shape
X=(#CardPadX#*#UiScale#)
Y=(#CardPadY#*#UiScale#)
Shape=Rectangle 0,0,(#WideCardW#*#UiScale#),(#VisualizerCardH#*#UiScale#),(#CardRadius#*#UiScale#)| Fill Color #CardFill# | StrokeWidth 1 | Stroke Color #CardStroke#

[MeterSuspended]
Meter=String
X=((168+#CardShiftX#)*#UiScale#)
Y=((31+#CardShiftY#)*#UiScale#)
FontFace=#fontName#
FontSize=#textSize#
FontColor=#ColorMuted#
StringEffect=Shadow
FontEffectColor=0,0,0,80
StringAlign=Center
Text=Visualizer paused for fullscreen
AntiAlias=1

[MeterPad]
Meter=Image
X=((#WideCardW#+#ActiveFrameW#-1)*#UiScale#)
Y=((#VisualizerCardH#+#ActiveFrameH#-1)*#UiScale#)
W=1
H=1
SolidColor=0,0,0,1
