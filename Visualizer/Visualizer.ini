; ==============================================================================
; Sleek Horizontal Audio Visualizer (Docked under NowPlaying)
; ==============================================================================
[Rainmeter]
Group=SlateHUD
@IncludeContext=#@#Context.inc
Update=#VisualizerUpdate#
AccurateText=1
DynamicWindowSize=0
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!Draggable 0][!CommandMeasure MeasureVisualState "Setup()"]

[Metadata]
Name=Horizontal Audio Visualizer
Author=Element
Information=Sleek gradient equalizer bar docked beneath NowPlaying (single Shape meter, configurable frame interval).
License=MIT
Version=2.4.0

[Variables]
@Include=#@#Variables.inc
VisualMode=0
CardW=#WideCardW#
CardH=#VisualizerCardH#
BarMaxH=24
BaseY=34
BarW=5
Bands=36
Sensitivity=#VisualizerSensitivity#
FFTAttack=#VisualizerAttack#
FFTDecay=#VisualizerDecay#

; ----------------------------------
; AUDIO LEVEL MEASURE
; ----------------------------------
[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTOverlap=512
FFTAttack=#FFTAttack#
FFTDecay=#FFTDecay#
FreqMin=25
FreqMax=16000
Sensitivity=#Sensitivity#
Bands=#Bands#

[MeasureAudioPeak]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Channel=Sum
Type=Peak

[MeasureVisualPower]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE
UpdateDivider=(Max(1,Round(1000/#VisualizerUpdate#)))

[MeasureMonitorsBridge]
Measure=Plugin
Plugin=SlateHUD
Stream=Monitors
FallbackPath=#@#Cache\monitors.txt
UpdateDivider=(Max(1,Round(1000/#VisualizerUpdate#)))

[MeasureVisualState]
Measure=Script
ScriptFile=#@#Visualizer.lua

[MeasureBand0]
Group=Bands
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=0
Channel=Sum

