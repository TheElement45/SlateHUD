[Rainmeter]
Group=SlateHUD
@IncludeContext=#@#Context.inc
Update=250
AccurateText=1
DynamicWindowSize=0
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!Draggable 0][!CommandMeasure MeasureVisualState "Setup()"]

[Metadata]
Name=Horizontal Audio Visualizer (Idle)
Author=Element
Information=Peak-only wake detection; FFT analysis is unloaded while idle.
License=MIT
Version=2.4.0

[Variables]
@Include=#@#Variables.inc
VisualMode=1
CardW=#WideCardW#
CardH=#VisualizerCardH#
BaseY=34
BarW=5

[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=0
Bands=0
RMSAttack=0
RMSDecay=0

[MeasureAudioPeak]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Channel=Sum
Type=Peak

[MeasureVisualPower]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE
UpdateDivider=4

[MeasureMonitorsBridge]
Measure=Plugin
Plugin=SlateHUD
Stream=Monitors
FallbackPath=#@#Cache\monitors.txt
UpdateDivider=4

[MeasureVisualState]
Measure=Script
ScriptFile=#@#Visualizer.lua

@IncludeAppearance=#CURRENTPATH#Appearance.inc
