name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build SlateHUDHelper.exe and SlateHUD.dll
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File "@Resources\build.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run PowerShell & helper regression suites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($suite in @(
            'Tests\ThemeRegression.ps1',
            'Tests\AppDiscoveryRegression.ps1',
            'Tests\AppScanRegression.ps1',
            'Tests\Regression.ps1'
          )) {
            Write-Host "=== Running $suite ==="
            & powershell -NoProfile -ExecutionPolicy Bypass -File $suite
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Set up Python 3.12 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install lupa (Lua 5.1) and run Lua widget tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --target Tests/.scratch-lua-runtime lupa
          python Tests\WidgetRegression.py

      - name: Package release archive dry-run & verify contents
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\PackageRelease.ps1" -Version "0.0.0-ci"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\SlateHUD-v0.0.0-ci-win64.zip"))
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
          } finally {
            $zip.Dispose()
          }

          foreach ($required in @(
            'SlateHUD/LICENSE',
            'SlateHUD/README.md',
            'SlateHUD/SECURITY.md',
            'SlateHUD/NowPlaying.ini',
            'SlateHUD/@Resources/SlateHUDHelper.exe',
            'SlateHUD/@Resources/Plugins/SlateHUD.dll'
          )) {
            if ($entries -notcontains $required) {
              throw "Missing required package entry: $required"
            }
          }

          $forbiddenPattern = '(?i)(^|/)(\.git|Tests|scripts|@Resources/Cache|@Resources/UserSettings\.inc|Notes/Data|Notes/Settings\.inc|Games/GameList\.inc|Games/Favorites\.txt|Games/Recent\.txt|Games/Preferences\.txt|Games/View\.inc|Apps/Catalog\.inc|Apps/Preferences\.txt|Apps/View\.inc|FrostBehind\.dll|FrostedGlass\.dll)|(\.(tmp|bak|obj|lib|exp|pdb)$)'
          $leaks = @($entries | Where-Object { $_ -match $forbiddenPattern })
          if ($leaks.Count -gt 0) {
            throw ("Forbidden entries found in release archive: " + ($leaks -join ', '))
          }
          Write-Host "PASS: Verified $($entries.Count) package entries with zero leaked artifacts."
