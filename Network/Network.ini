[Rainmeter]
Group=SlateHUD
@IncludeContext=#@#Context.inc
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle19=---
ContextAction19=[]
ContextTitle20=Toggle traffic history (Off)
ContextAction20=[!CommandMeasure measureNetwork "ToggleHistory()"]
ContextTitle21=Toggle ping monitoring (Off)
ContextAction21=[!CommandMeasure measureNetwork "TogglePing()"]
ContextTitle22=Switch traffic scale (Auto)
ContextAction22=[!CommandMeasure measureNetwork "ToggleScale()"]

[Metadata]
Name=Network
Author=Element
Information=Public/local IP and network activity, with optional ping latency.
Version=2.4.0
License=MIT

[Variables]
@Include=#@#Variables.inc
; NetPingEnabled defaults to 0 in Variables.inc and can be overridden in UserSettings.inc.
pingHost=1.1.1.1
; Family-specific hosts prevent an IPv6 response from reaching the IPv4 field.
NetIPv4PrimaryURL=https://ipv4.icanhazip.com
NetIPv4FallbackURL=https://4.ident.me
NetIPv6PrimaryURL=https://ipv6.icanhazip.com
NetIPv6FallbackURL=https://6.ident.me
NetIPv4Text=Checking...
NetIPv6Text=Checking...
NetIPv6State=Checking...
NetIPv4Last=Never
NetIPv6Last=Never
NetPingText=Checking...
NetScaleText=Auto
NetScaleCeilings=Checking...
@Include2=#@#Styles.inc

; ----------------------------------
; MEASURES return some kind of value
; ----------------------------------

[measureIPv4Lookup]
Measure=WebParser
URL=#NetIPv4PrimaryURL#
UpdateRate=900
DynamicVariables=1
Flags=ForceReload | NoCookies
RegExp=^\s*([0-9.]+)\s*$
StringIndex=1
FinishAction=[!CommandMeasure measureNetwork "LookupFinished(4)"]
OnConnectErrorAction=[!CommandMeasure measureNetwork "LookupFailed(4)"]
OnRegExpErrorAction=[!CommandMeasure measureNetwork "LookupFailed(4)"]

[measureIPv6Lookup]
Measure=WebParser
URL=#NetIPv6PrimaryURL#
UpdateRate=900
DynamicVariables=1
Flags=ForceReload | NoCookies
RegExp=^\s*([0-9A-Fa-f:.]+)\s*$
StringIndex=1
FinishAction=[!CommandMeasure measureNetwork "LookupFinished(6)"]
OnConnectErrorAction=[!CommandMeasure measureNetwork "LookupFailed(6)"]
OnRegExpErrorAction=[!CommandMeasure measureNetwork "LookupFailed(6)"]

; Only validated, current results reach display measures, including hover reveal.
[measureIP]
Measure=String
String=#NetIPv4Text#
DynamicVariables=1
Group=NetworkDisplay

[measureIPv6]
Measure=String
String=#NetIPv6Text#
DynamicVariables=1
Group=NetworkDisplay

; Public IPv4 with the first three parts hidden: 203.0.113.42 -> bullets.42
[measureIPMasked]
Measure=String
String=[measureIP]
DynamicVariables=1
Group=NetworkDisplay
RegExpSubstitute=1
Substitute="^\d+\.\d+\.\d+\.(\d+)$":"[\x2022][\x2022][\x2022].[\x2022][\x2022][\x2022].[\x2022][\x2022][\x2022].\1"

; IPv6 is only summarised on screen; the full address is in the hover tooltip.
[measureIPv6State]
Measure=String
String=#NetIPv6State#
DynamicVariables=1
Group=NetworkDisplay

[measureLANIP]
Measure=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
UpdateDivider=5
DynamicVariables=1
Group=NetworkIdentity
Substitute="":"N/A"

[measureAdapter]
Measure=SysInfo
SysInfoType=ADAPTER_ALIAS
SysInfoData=Best
UpdateDivider=5
DynamicVariables=1
Group=NetworkIdentity
Substitute="":"None"

[measureAdapterID]
Measure=SysInfo
SysInfoType=ADAPTER_GUID
SysInfoData=Best
UpdateDivider=5
DynamicVariables=1
Group=NetworkIdentity

[measureConnectivityV4]
Measure=SysInfo
SysInfoType=INTERNET_CONNECTIVITY_V4
SysInfoData=Best
UpdateDivider=5
DynamicVariables=1
Group=NetworkIdentity

[measureConnectivityV6]
Measure=SysInfo
SysInfoType=INTERNET_CONNECTIVITY_V6
SysInfoData=Best
UpdateDivider=5
DynamicVariables=1
Group=NetworkIdentity

[measurePing]
Measure=Plugin
Plugin=PingPlugin
Disabled=(1-#NetPingEnabled#)
DestAddress=#pingHost#
UpdateRate=5
Timeout=2000
; A sentinel beyond the timeout keeps failed probes distinct from real latency.
TimeoutValue=2001
DynamicVariables=1
FinishAction=[!CommandMeasure measureNetwork "PingFinished()"]

[measureNetIn]
Measure=NetIn
Interface=Best
DynamicVariables=1
NetInSpeed=(#maxDownload#*(1-#NetAutoScale#))

[measureNetOut]
Measure=NetOut
Interface=Best
DynamicVariables=1
NetOutSpeed=(#maxUpload#*(1-#NetAutoScale#))

; Runs after identity and ping measures so decisions use this update's values.
[measureNetwork]
Measure=Script
ScriptFile=#@#Network.lua

; ----------------------------------
; METERS display images, text, bars, etc.
; ----------------------------------

[meterCard]
Meter=Shape
MeterStyle=styleCard
X=(#CardPadX#*#UiScale#)
Y=(#CardPadY#*#UiScale#)
Shape=Rectangle 0,0,(#StatCardW#*#UiScale#),((#StatCardH#+40*#NetHistory#)*#UiScale#),(#CardRadius#*#UiScale#) | Fill Color #CardFill# | StrokeWidth 1 | Stroke Color #CardStroke#

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=((119+#CardShiftX#)*#UiScale#)
Y=((32+#CardShiftY#)*#UiScale#)
W=(120*#UiScale#)
H=(18*#UiScale#)
Text=Network
Group=NetworkUI
LeftMouseUpAction=[!CommandMeasure measureNetwork "RefreshAll()"]
ToolTipText=Click to refresh network information#CRLF#IPv4 last success: #NetIPv4Last##CRLF#IPv6 last success: #NetIPv6Last#
DynamicVariables=1

[meterScaleMode]
Meter=String
MeterStyle=styleRightText
StringAlign=CenterCenter
X=((199+#CardShiftX#)*#UiScale#)
Y=((39+#CardShiftY#)*#UiScale#)
W=(34*#UiScale#)
H=(18*#UiScale#)
FontSize=(8*#UiScale#)
FontColor=#ColorMuted#
Text=#NetScaleText#
DynamicVariables=1
Group=NetworkUI
LeftMouseUpAction=[!CommandMeasure measureNetwork "ToggleScale()"]
ToolTipText=Click to switch automatic / fixed traffic bars
MouseActionCursor=1
SolidColor=#ColorPill#

[meterIPLabel]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((62+#CardShiftY#)*#UiScale#)
W=(90*#UiScale#)
H=(14*#UiScale#)
Text=WAN IPv4

[meterIPValue]
Meter=String
Group=NetworkUI
MeterStyle=styleRightText
MeasureName=#NetIPDisplay#
DynamicVariables=1
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(90*#UiScale#)
H=(14*#UiScale#)
Text=%1
MouseOverAction=[!SetOption #CURRENTSECTION# MeasureName measureIP][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# MeasureName #NetIPDisplay#][!UpdateMeter #CURRENTSECTION#][!Redraw]
LeftMouseUpAction=[!CommandMeasure measureNetwork "RefreshAll()"]
ToolTipText=Hover to reveal | Click to refresh#CRLF#Last successful IPv4 lookup: #NetIPv4Last#

[meterLANLabel]
Meter=String
MeterStyle=styleLeftText
MeasureName=measureAdapter
X=((26+#CardShiftX#)*#UiScale#)
Y=((78+4*(1-#NetPingEnabled#)+#CardShiftY#)*#UiScale#)
W=(90*#UiScale#)
H=(14*#UiScale#)
Text=LAN (%1)
ToolTipText=Adapter: [measureAdapter]#CRLF#LAN IP: [measureLANIP]
DynamicVariables=1
Group=NetworkUI

[meterLANValue]
Meter=String
MeterStyle=styleRightText
MeasureName=measureLANIP
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(90*#UiScale#)
H=(14*#UiScale#)
Text=%1
ToolTipText=LAN IP: [measureLANIP]#CRLF#Adapter: [measureAdapter]
DynamicVariables=1
Group=NetworkUI

[meterIPv6Label]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((94+8*(1-#NetPingEnabled#)+#CardShiftY#)*#UiScale#)
W=(90*#UiScale#)
H=(14*#UiScale#)
Text=IPv6

[meterIPv6Value]
Meter=String
MeterStyle=styleRightText
MeasureName=measureIPv6State
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(90*#UiScale#)
H=(14*#UiScale#)
Text=%1
ToolTipText=[measureIPv6]#CRLF#Last successful IPv6 lookup: #NetIPv6Last##CRLF#Click to refresh
LeftMouseUpAction=[!CommandMeasure measureNetwork "RefreshAll()"]
DynamicVariables=1
Group=NetworkUI

[meterPingLabel]
Meter=String
Hidden=(1-#NetPingEnabled#)
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((110+#CardShiftY#)*#UiScale#)
W=(90*#UiScale#)
H=(14*#UiScale#)
Text=Ping (#pingHost#)

[meterPingValue]
Meter=String
Hidden=(1-#NetPingEnabled#)
MeterStyle=styleRightText
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(90*#UiScale#)
H=(14*#UiScale#)
Text=#NetPingText#
DynamicVariables=1
Group=NetworkUI
ToolTipText=Latency to #pingHost# | Click to refresh
LeftMouseUpAction=[!CommandMeasure measureNetwork "RefreshAll()"]

[meterSeperator]
Meter=Image
MeterStyle=styleSeperator
X=((26+#CardShiftX#)*#UiScale#)
Y=((126+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)

[meterUploadLabel]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((134+#CardShiftY#)*#UiScale#)
W=(90*#UiScale#)
H=(14*#UiScale#)
Text=[\x2191] Upload
ToolTipText=Traffic bars: #NetScaleText# | Click to switch automatic / fixed scale
LeftMouseUpAction=[!CommandMeasure measureNetwork "ToggleScale()"]
DynamicVariables=1
Group=NetworkUI

[meterUploadValue]
Meter=String
MeterStyle=styleRightText
MeasureName=measureNetOut
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(90*#UiScale#)
H=(14*#UiScale#)
Text=%1B/s
NumOfDecimals=1
AutoScale=1

[meterUploadBar]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureNetOut
X=((26+#CardShiftX#)*#UiScale#)
Y=((150+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)
LeftMouseUpAction=[!CommandMeasure measureNetwork "ToggleScale()"]
ToolTipText=Traffic bars: #NetScaleText##CRLF#Scale ceiling: #NetScaleCeilings##CRLF#Click the label to change scale
DynamicVariables=1
Group=NetworkUI

[meterDownloadLabel]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((154+#CardShiftY#)*#UiScale#)
W=(90*#UiScale#)
H=(14*#UiScale#)
Text=[\x2193] Download
ToolTipText=Traffic bars: #NetScaleText# | Click to switch automatic / fixed scale
LeftMouseUpAction=[!CommandMeasure measureNetwork "ToggleScale()"]
DynamicVariables=1
Group=NetworkUI

[meterDownloadValue]
Meter=String
MeterStyle=styleRightText
MeasureName=measureNetIn
X=((212+#CardShiftX#)*#UiScale#)
Y=0r
W=(90*#UiScale#)
H=(14*#UiScale#)
Text=%1B/s
NumOfDecimals=1
AutoScale=1

[meterDownloadBar]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureNetIn
X=((26+#CardShiftX#)*#UiScale#)
Y=((170+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(1*#UiScale#)
LeftMouseUpAction=[!CommandMeasure measureNetwork "ToggleScale()"]
ToolTipText=Traffic bars: #NetScaleText##CRLF#Scale ceiling: #NetScaleCeilings##CRLF#Click the label to change scale
DynamicVariables=1
Group=NetworkUI

; Invisible 1px meter: reserves transparent padding so snapping to a screen edge leaves a gap
[MeterPad]
Meter=Shape
X=((#StatCardW#+#ActiveFrameW#-1)*#UiScale#)
Y=((#StatCardH#+#ActiveFrameH#-1+40*#NetHistory#)*#UiScale#)
Shape=Rectangle 0,0,(1*#UiScale#),(1*#UiScale#)| Fill Color 0,0,0,1 | StrokeWidth 0

[meterHistoryLabel]
Meter=String
MeterStyle=styleLeftText
X=((26+#CardShiftX#)*#UiScale#)
Y=((180+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(14*#UiScale#)
Text=Recent traffic (down / up)
FontColor=#ColorSecondary#
Hidden=(1-#NetHistory#)

[meterHistory]
Meter=Line
MeasureName=measureNetIn
MeasureName2=measureNetOut
X=((26+#CardShiftX#)*#UiScale#)
Y=((196+#CardShiftY#)*#UiScale#)
W=(190*#UiScale#)
H=(18*#UiScale#)
LineCount=2
LineColor=#ColorAccent#
LineColor2=#ColorHistory2#
LineWidth=1
AutoScale=1
AntiAlias=1
Hidden=(1-#NetHistory#)
